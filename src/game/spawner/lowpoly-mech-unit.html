<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Low Poly RTS Rifleman</title>
<style>
body { margin:0; overflow:hidden; background:#1b1b1b; }
canvas { display:block; }
#ui{
position:absolute;
top:10px;
left:10px;
color:white;
font-family:monospace;
background:#000a;
padding:8px;
}
</style>
</head>
<body>

<div id="ui">
1 = Idle<br>
2 = Run<br>
3 = Shoot<br>
4 = Die
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";

//////////////////////////////////////////////////////////////
// SCENE
//////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2a2a);

const camera = new THREE.PerspectiveCamera(
  60,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0, 6, 14);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

//////////////////////////////////////////////////////////////
// LIGHTS
//////////////////////////////////////////////////////////////

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(5,10,5);
scene.add(dirLight);

//////////////////////////////////////////////////////////////
// FLOOR
//////////////////////////////////////////////////////////////

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(100,100),
  new THREE.MeshStandardMaterial({
    color:0x3a4a3a
  })
);

floor.rotation.x = -Math.PI/2;
scene.add(floor);

//////////////////////////////////////////////////////////////
// MATERIALS
//////////////////////////////////////////////////////////////

const MAT = {
  blue: new THREE.MeshStandardMaterial({ color:0x2957c8, flatShading:true }),
  darkBlue: new THREE.MeshStandardMaterial({ color:0x1d2d6e, flatShading:true }),
  brown: new THREE.MeshStandardMaterial({ color:0x6e4a2c, flatShading:true }),
  leather: new THREE.MeshStandardMaterial({ color:0x8a633d, flatShading:true }),
  skin: new THREE.MeshStandardMaterial({ color:0xd1b08c, flatShading:true }),
  metal: new THREE.MeshStandardMaterial({ color:0x9fa6ad, flatShading:true }),
  gunMetal: new THREE.MeshStandardMaterial({ color:0x666666, flatShading:true }),
  beard: new THREE.MeshStandardMaterial({ color:0xe6e6e6, flatShading:true }),
  black: new THREE.MeshStandardMaterial({ color:0x222222, flatShading:true }),
  muzzle: new THREE.MeshStandardMaterial({
    color:0xffaa00,
    emissive:0xff7700,
    emissiveIntensity:2,
    flatShading:true
  })
};

//////////////////////////////////////////////////////////////
// PURE JSON MODEL DATA
//////////////////////////////////////////////////////////////

const riflemanJSON = {

  root: {
    pos:[0,0,0],
    children:["body","cape"]
  },

  body:{
    pos:[0,3,0],
    geo:["box",2.3,2.6,1.6],
    mat:"brown",
    children:[
      "head",
      "leftArm",
      "rightArm",
      "leftLeg",
      "rightLeg",
      "rifle"
    ]
  },

  head:{
    pos:[0,2.1,0],
    geo:["box",1.5,1.5,1.5],
    mat:"skin",
    children:["hood","beard"]
  },

  hood:{
    pos:[0,0.2,0],
    geo:["cone",1.2,1.8,4],
    mat:"blue"
  },

  beard:{
    pos:[0,-1.1,0.4],
    geo:["cone",0.6,1.8,4],
    mat:"beard"
  },

  leftArm:{
    pos:[-1.8,0.7,0],
    geo:["box",0.8,2.2,0.8],
    mat:"leather"
  },

  rightArm:{
    pos:[1.8,0.7,0],
    geo:["box",0.8,2.2,0.8],
    mat:"leather"
  },

  leftLeg:{
    pos:[-0.7,-2.2,0],
    geo:["box",0.9,2.4,1],
    mat:"brown"
  },

  rightLeg:{
    pos:[0.7,-2.2,0],
    geo:["box",0.9,2.4,1],
    mat:"brown"
  },

  cape:{
    pos:[0,3.5,-1.1],
    geo:["box",2.5,4,0.2],
    mat:"darkBlue"
  },

  rifle:{
    pos:[1,0.3,1.2],
    geo:["box",4.5,0.45,0.45],
    mat:"brown",
    children:["barrel","muzzleFlash"]
  },

  barrel:{
    pos:[2.3,0,0],
    geo:["cyl",0.28,0.28,1.8,6],
    rot:[0,0,Math.PI/2],
    mat:"gunMetal"
  },

  muzzleFlash:{
    pos:[3.1,0,0],
    geo:["cone",0.35,1,6],
    rot:[0,0,-Math.PI/2],
    mat:"muzzle",
    visible:false
  }

};

//////////////////////////////////////////////////////////////
// MODEL BUILDER
//////////////////////////////////////////////////////////////

const bones = {};

function buildNode(name, data){

  const group = new THREE.Group();
  bones[name] = group;

  if(data.pos)
    group.position.set(...data.pos);

  if(data.rot)
    group.rotation.set(...data.rot);

  if(data.geo){

    let mesh;

    const g = data.geo;

    if(g[0] === "box"){
      mesh = new THREE.Mesh(
        new THREE.BoxGeometry(g[1],g[2],g[3]),
        MAT[data.mat]
      );
    }

    if(g[0] === "cone"){
      mesh = new THREE.Mesh(
        new THREE.ConeGeometry(g[1],g[2],g[3]),
        MAT[data.mat]
      );
    }

    if(g[0] === "cyl"){
      mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(g[1],g[2],g[3],g[4]),
        MAT[data.mat]
      );
    }

    mesh.castShadow = true;

    if(data.visible === false)
      mesh.visible = false;

    group.add(mesh);

    group.mesh = mesh;
  }

  if(data.children){

    for(const childName of data.children){

      const child = buildNode(
        childName,
        riflemanJSON[childName]
      );

      group.add(child);
    }
  }

  return group;
}

const rifleman = buildNode("root", riflemanJSON);

scene.add(rifleman);

//////////////////////////////////////////////////////////////
// ANIMATION STATES
//////////////////////////////////////////////////////////////

const anim = {
  state:"idle",
  time:0
};

//////////////////////////////////////////////////////////////
// ANIMATION LOOP
//////////////////////////////////////////////////////////////

function updateAnimation(dt){

  anim.time += dt;

  const t = anim.time;

  const LA = bones.leftArm;
  const RA = bones.rightArm;
  const LL = bones.leftLeg;
  const RL = bones.rightLeg;
  const CAPE = bones.cape;
  const BODY = bones.body;
  const MUZZLE = bones.muzzleFlash;

  MUZZLE.mesh.visible = false;

  //////////////////////////////////////////////////////////
  // IDLE
  //////////////////////////////////////////////////////////

  if(anim.state === "idle"){

    BODY.position.y = 3 + Math.sin(t*2)*0.06;

    LA.rotation.x = Math.sin(t*2)*0.05;
    RA.rotation.x = -Math.sin(t*2)*0.05;

    CAPE.rotation.x = Math.sin(t*1.5)*0.05;
  }

  //////////////////////////////////////////////////////////
  // RUN
  //////////////////////////////////////////////////////////

  if(anim.state === "run"){

    const swing = Math.sin(t*10);

    LL.rotation.x = swing * 0.9;
    RL.rotation.x = -swing * 0.9;

    LA.rotation.x = -swing * 0.5;
    RA.rotation.x = swing * 0.5;

    BODY.position.y = 3 + Math.abs(Math.sin(t*10))*0.3;

    CAPE.rotation.x = 0.6 + Math.sin(t*12)*0.2;

    rifleman.position.x += 0.03;

    if(rifleman.position.x > 10)
      rifleman.position.x = -10;
  }

  //////////////////////////////////////////////////////////
  // SHOOT
  //////////////////////////////////////////////////////////

  if(anim.state === "shoot"){

    const kick = Math.sin(t*25);

    RA.rotation.x = -0.5 + kick * 0.1;
    LA.rotation.x = -0.3;

    BODY.rotation.z = -0.05 * kick;

    if(kick > 0.92)
      MUZZLE.mesh.visible = true;
  }

  //////////////////////////////////////////////////////////
  // DIE
  //////////////////////////////////////////////////////////

  if(anim.state === "die"){

    rifleman.rotation.z = Math.min(
      Math.PI/2,
      rifleman.rotation.z + 0.02
    );

    CAPE.rotation.x = 1;
  }

}

//////////////////////////////////////////////////////////////
// CONTROLS
//////////////////////////////////////////////////////////////

window.addEventListener("keydown", e=>{

  if(e.key==="1"){
    anim.state="idle";
  }

  if(e.key==="2"){
    anim.state="run";
  }

  if(e.key==="3"){
    anim.state="shoot";
  }

  if(e.key==="4"){
    anim.state="die";
  }

});

//////////////////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////////////////

let camRot = 0;

//////////////////////////////////////////////////////////////
// LOOP
//////////////////////////////////////////////////////////////

const clock = new THREE.Clock();

function loop(){

  requestAnimationFrame(loop);

  const dt = clock.getDelta();

  camRot += dt * 0.25;

  camera.position.x = Math.sin(camRot)*12;
  camera.position.z = Math.cos(camRot)*12;

  camera.lookAt(0,3,0);

  updateAnimation(dt);

  renderer.render(scene,camera);
}

loop();

//////////////////////////////////////////////////////////////
// RESIZE
//////////////////////////////////////////////////////////////

addEventListener("resize", ()=>{

  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);

});

</script>
</body>
</html>
