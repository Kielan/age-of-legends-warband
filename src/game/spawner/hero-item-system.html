<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Hero + Item System</title>
<style>
body { margin:0; overflow:hidden; background:#111; }
#ui {
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#000;
    color:white;
    font-family:sans-serif;
    font-size:12px;
    padding:6px;
}
</style>
</head>
<body>

<div id="ui"></div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2b1b);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(120,120,120);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun = new THREE.DirectionalLight(0xffffff,1);
sun.position.set(100,150,100);
scene.add(sun);

////////////////////////////////////////////////////////////
// GROUND
////////////////////////////////////////////////////////////

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(250,250),
    new THREE.MeshStandardMaterial({ color:0x2c5a2c })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

////////////////////////////////////////////////////////////
// HERO
////////////////////////////////////////////////////////////

const hero = new THREE.Mesh(
    new THREE.SphereGeometry(1),
    new THREE.MeshStandardMaterial({ color:0x66ccff })
);

hero.position.set(0,0,0);
scene.add(hero);

let heroStats = {
    level:1,
    xp:0,
    atk:12,
    lifesteal:0,
    invisible:false
};

let inventory = [];

////////////////////////////////////////////////////////////
// ITEMS
////////////////////////////////////////////////////////////

const ItemType = {
    VAMPIRIC:"vampiric_mask",
    INVIS_SCROLL:"scroll_invis",
    INVIS_RING:"ring_invis"
};

function giveItem(type){

    inventory.push(type);

    if(type === ItemType.VAMPIRIC){
        heroStats.lifesteal = 0.15;
    }

    if(type === ItemType.INVIS_RING){
        heroStats.invisible = true;
        hero.material.transparent = true;
        hero.material.opacity = 0.2;
    }

    updateUI();
}

function useScroll(){

    if(inventory.includes(ItemType.INVIS_SCROLL)){
        heroStats.invisible = true;
        hero.material.opacity = 0.2;

        setTimeout(()=>{
            heroStats.invisible = false;
            hero.material.opacity = 1;
        },5000);
    }
}

////////////////////////////////////////////////////////////
// CREEPS
////////////////////////////////////////////////////////////

const creeps = [];

function spawnCreep(pos){

    const mesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.5,1),
        new THREE.MeshStandardMaterial({ color:0x33aa33 })
    );

    mesh.position.copy(pos);
    scene.add(mesh);

    creeps.push({
        mesh,
        hp:30
    });
}

for(let i=0;i<20;i++){
    spawnCreep(new THREE.Vector3(
        (Math.random()-0.5)*200,
        0,
        (Math.random()-0.5)*200
    ));
}

////////////////////////////////////////////////////////////
// XP SYSTEM
////////////////////////////////////////////////////////////

function gainXP(amount){

    heroStats.xp += amount;

    if(heroStats.xp >= 100){

        heroStats.xp = 0;
        heroStats.level++;

        heroStats.atk += 2;

        updateUI();
    }
}

////////////////////////////////////////////////////////////
// COMBAT
////////////////////////////////////////////////////////////

function attackCreep(creep){

    creep.hp -= heroStats.atk;

    heroStats.hp = (heroStats.hp||100) + heroStats.atk * heroStats.lifesteal;

    if(creep.hp <= 0){

        scene.remove(creep.mesh);
        creeps.splice(creeps.indexOf(creep),1);

        gainXP(25);

        maybeDropItem(creep.mesh.position);
    }
}

////////////////////////////////////////////////////////////
// ITEM DROP SYSTEM
////////////////////////////////////////////////////////////

function maybeDropItem(pos){

    const r = Math.random();

    if(r < 0.35){

        const dropPool = [
            ItemType.VAMPIRIC,
            ItemType.INVIS_SCROLL,
            ItemType.INVIS_RING
        ];

        const item = dropPool[Math.floor(Math.random()*dropPool.length)];

        console.log("Dropped:", item);

        giveItem(item);
    }
}

////////////////////////////////////////////////////////////
// HERO INTERACTION LOOP
////////////////////////////////////////////////////////////

window.addEventListener("click",()=>{

    for(const c of creeps){

        const d = hero.position.distanceTo(c.mesh.position);

        if(d < 5){
            attackCreep(c);
            break;
        }
    }
});

////////////////////////////////////////////////////////////
// SIMPLE HERO MOVE
////////////////////////////////////////////////////////////

window.addEventListener("mousemove",(e)=>{

    const x = (e.clientX/innerWidth)*2-1;
    const y = -(e.clientY/innerHeight)*2+1;

    const ray = new THREE.Raycaster();
    ray.setFromCamera({x,y},camera);

    const hit = ray.intersectObject(ground)[0];

    if(hit){
        hero.position.copy(hit.point);
    }
});

////////////////////////////////////////////////////////////
// UI
////////////////////////////////////////////////////////////

const ui = document.getElementById("ui");

function updateUI(){

    ui.innerHTML = `
        <div>Hero Level: ${heroStats.level}</div>
        <div>XP: ${heroStats.xp}/100</div>
        <div>ATK: ${heroStats.atk}</div>
        <div>Lifesteal: ${(heroStats.lifesteal*100).toFixed(0)}%</div>
        <div>Inventory: ${inventory.join(", ")}</div>
        <button onclick="useScroll()">Use Scroll</button>
    `;
}

updateUI();

////////////////////////////////////////////////////////////
// CAMERA
////////////////////////////////////////////////////////////

camera.position.set(120,120,120);
camera.lookAt(0,0,0);

////////////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////////////

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
