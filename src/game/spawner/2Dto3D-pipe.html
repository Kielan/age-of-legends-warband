<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mesh → Skeleton → 3D Character</title>

<style>

html, body {
  margin: 0;
  overflow: hidden;
  background: #111;
  font-family: Arial;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 340px;
  background: rgba(0,0,0,.82);
  color: white;
  padding: 14px;
  border-radius: 12px;
  z-index: 10;
}

button, input {
  width: 100%;
  margin-top: 8px;
}

.label {
  font-size: 12px;
  margin-top: 10px;
  line-height: 1.5;
  opacity: .8;
}

canvas {
  display: block;
}

</style>
</head>

<body>

<div id="ui">

  <h2>Mesh Skeleton Generator</h2>

  <input type="file" id="upload" accept="image/*">

  <button id="toggleWire">
    Toggle Wireframe
  </button>

  <button id="toggleSkeleton">
    Toggle Skeleton
  </button>

  <button id="exportGLTF">
    Export GLTF
  </button>

  <div class="label">

    Pipeline:<br><br>

    ✓ Mesh line extraction<br>
    ✓ Vertex inference<br>
    ✓ Edge graph generation<br>
    ✓ Triangle face generation<br>
    ✓ 3D depth inference<br>
    ✓ Skeleton rig inference<br>
    ✓ Interactive selection<br>
    ✓ Browser preview<br>
    ✓ GLTF export<br>

  </div>

</div>

<script type="module">

/*
==================================================
IMPORTS
==================================================
*/

import * as THREE from 'https://esm.sh/three@0.161.0';

import { OrbitControls }
from 'https://esm.sh/three@0.161.0/examples/jsm/controls/OrbitControls.js';

import { GLTFExporter }
from 'https://esm.sh/three@0.161.0/examples/jsm/exporters/GLTFExporter.js';

/*
==================================================
SCENE
==================================================
*/

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x181818);

const camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    5000
  );

camera.position.set(0, 40, 180);

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(
  renderer.domElement
);

/*
==================================================
CONTROLS
==================================================
*/

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;

/*
==================================================
LIGHTS
==================================================
*/

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.0
  )
);

const dir =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

dir.position.set(20, 50, 40);

scene.add(dir);

/*
==================================================
RAYCAST
==================================================
*/

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

let selected = null;

/*
==================================================
GROUPS
==================================================
*/

const pointGroup =
  new THREE.Group();

const edgeGroup =
  new THREE.Group();

const faceGroup =
  new THREE.Group();

const skeletonGroup =
  new THREE.Group();

scene.add(pointGroup);
scene.add(edgeGroup);
scene.add(faceGroup);
scene.add(skeletonGroup);

/*
==================================================
SELECTION
==================================================
*/

window.addEventListener(
  'pointerdown',
  (e) => {

    mouse.x =
      (e.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
      -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(
      mouse,
      camera
    );

    const hits =
      raycaster.intersectObjects([
        ...pointGroup.children,
        ...edgeGroup.children,
        ...faceGroup.children
      ]);

    if (hits.length > 0) {

      if (selected) {

        restoreColor(selected);

      }

      selected = hits[0].object;

      selected.material.color.set(0xffff00);

    }

  }
);

function restoreColor(obj) {

  const type =
    obj.userData.type;

  if (type === 'point')
    obj.material.color.set(0xff00aa);

  if (type === 'edge')
    obj.material.color.set(0xffffff);

  if (type === 'face')
    obj.material.color.set(0x00ffaa);

}

/*
==================================================
UPLOAD
==================================================
*/

document
.getElementById('upload')
.addEventListener(
  'change',
  async (e) => {

    const file =
      e.target.files[0];

    if (!file) return;

    const img = new Image();

    img.src =
      URL.createObjectURL(file);

    await img.decode();

    generateMesh(img);

  }
);

/*
==================================================
CLEAR
==================================================
*/

function clearAll() {

  [
    pointGroup,
    edgeGroup,
    faceGroup,
    skeletonGroup
  ].forEach(group => {

    while(group.children.length > 0) {

      group.remove(
        group.children[0]
      );

    }

  });

}

/*
==================================================
MAIN PIPELINE
==================================================
*/

function generateMesh(img) {

  clearAll();

  /*
  --------------------------------------
  READ IMAGE
  --------------------------------------
  */

  const canvas =
    document.createElement('canvas');

  const ctx =
    canvas.getContext('2d');

  canvas.width = img.width;
  canvas.height = img.height;

  ctx.drawImage(img,0,0);

  const imageData =
    ctx.getImageData(
      0,
      0,
      img.width,
      img.height
    );

  const data =
    imageData.data;

  /*
  --------------------------------------
  INFER VERTICES
  --------------------------------------
  */

  const verts = [];

  const step = 6;

  for (let y=1; y<img.height-1; y+=step) {

    for (let x=1; x<img.width-1; x+=step) {

      const i =
        (y * img.width + x) * 4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];

      const bright =
        (r + g + b) / 3;

      /*
      detect mesh lines
      */

      if (bright < 90) {

        const nearby =
          countDarkNeighbors(
            data,
            img.width,
            img.height,
            x,
            y
          );

        /*
        likely intersection
        */

        if (nearby >= 4) {

          const px =
            x - img.width/2;

          const py =
            -(y - img.height/2);

          /*
          fake depth
          */

          const pz =
            Math.sin(px * .04) * 8 +
            Math.cos(py * .03) * 8;

          const v =
            new THREE.Vector3(
              px,
              py,
              pz
            );

          verts.push(v);

        }

      }

    }

  }

  /*
  --------------------------------------
  POINTS
  --------------------------------------
  */

  verts.forEach(v => {

    const geo =
      new THREE.SphereGeometry(
        1.2,
        8,
        8
      );

    const mat =
      new THREE.MeshBasicMaterial({
        color: 0xff00aa
      });

    const p =
      new THREE.Mesh(
        geo,
        mat
      );

    p.position.copy(v);

    p.userData.type =
      'point';

    pointGroup.add(p);

  });

  /*
  --------------------------------------
  EDGES
  --------------------------------------
  */

  const threshold = 16;

  for (let i=0; i<verts.length; i++) {

    for (let j=i+1; j<verts.length; j++) {

      const a = verts[i];
      const b = verts[j];

      const dist =
        a.distanceTo(b);

      if (dist < threshold) {

        const geo =
          new THREE.BufferGeometry()
          .setFromPoints([a,b]);

        const mat =
          new THREE.LineBasicMaterial({
            color: 0xffffff
          });

        const line =
          new THREE.Line(
            geo,
            mat
          );

        line.userData.type =
          'edge';

        edgeGroup.add(line);

      }

    }

  }

  /*
  --------------------------------------
  FACES
  --------------------------------------
  */

  for (let i=0; i<verts.length-2; i+=3) {

    const a = verts[i];
    const b = verts[i+1];
    const c = verts[i+2];

    const geo =
      new THREE.BufferGeometry();

    geo.setAttribute(
      'position',
      new THREE.Float32BufferAttribute([

        a.x,a.y,a.z,
        b.x,b.y,b.z,
        c.x,c.y,c.z

      ],3)
    );

    geo.computeVertexNormals();

    const mat =
      new THREE.MeshStandardMaterial({

        color: 0x00ffaa,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: .65

      });

    const face =
      new THREE.Mesh(
        geo,
        mat
      );

    face.userData.type =
      'face';

    faceGroup.add(face);

  }

  /*
  --------------------------------------
  SKELETON INFERENCE
  --------------------------------------
  */

  createSkeleton(img);

}

/*
==================================================
SKELETON
==================================================
*/

function createSkeleton(img) {

  /*
  very rough humanoid inference
  based on image proportions
  */

  const bones = [

    [0, 40, 0],
    [0, 20, 0],
    [0, 0, 0],

    [-15, -20, 0],
    [-15, -50, 0],

    [15, -20, 0],
    [15, -50, 0],

    [-30, 10, 0],
    [-50, -10, 0],

    [30, 10, 0],
    [50, -10, 0]

  ];

  /*
  joints
  */

  const joints = [];

  bones.forEach(p => {

    const geo =
      new THREE.SphereGeometry(
        2,
        10,
        10
      );

    const mat =
      new THREE.MeshBasicMaterial({
        color: 0x00ffff
      });

    const joint =
      new THREE.Mesh(
        geo,
        mat
      );

    joint.position.set(
      p[0],
      p[1],
      p[2]
    );

    skeletonGroup.add(joint);

    joints.push(joint);

  });

  /*
  skeleton lines
  */

  const links = [

    [0,1],
    [1,2],

    [2,3],
    [3,4],

    [2,5],
    [5,6],

    [1,7],
    [7,8],

    [1,9],
    [9,10]

  ];

  links.forEach(link => {

    const a =
      joints[link[0]].position;

    const b =
      joints[link[1]].position;

    const geo =
      new THREE.BufferGeometry()
      .setFromPoints([a,b]);

    const mat =
      new THREE.LineBasicMaterial({
        color: 0x00ffff
      });

    const line =
      new THREE.Line(
        geo,
        mat
      );

    skeletonGroup.add(line);

  });

}

/*
==================================================
NEIGHBOR DETECTION
==================================================
*/

function countDarkNeighbors(
  data,
  width,
  height,
  x,
  y
) {

  let count = 0;

  for (let oy=-1; oy<=1; oy++) {

    for (let ox=-1; ox<=1; ox++) {

      if (ox===0 && oy===0)
        continue;

      const nx = x + ox;
      const ny = y + oy;

      const i =
        (ny * width + nx) * 4;

      const r = data[i];
      const g = data[i+1];
      const b = data[i+2];

      const bright =
        (r+g+b)/3;

      if (bright < 90)
        count++;

    }

  }

  return count;

}

/*
==================================================
TOGGLES
==================================================
*/

document
.getElementById('toggleWire')
.onclick = () => {

  faceGroup.visible =
    !faceGroup.visible;

};

document
.getElementById('toggleSkeleton')
.onclick = () => {

  skeletonGroup.visible =
    !skeletonGroup.visible;

};

/*
==================================================
EXPORT
==================================================
*/

document
.getElementById('exportGLTF')
.onclick = () => {

  const exporter =
    new GLTFExporter();

  exporter.parse(

    scene,

    (gltf) => {

      const blob =
        new Blob(
          [JSON.stringify(gltf)],
          {type:'application/json'}
        );

      const link =
        document.createElement('a');

      link.href =
        URL.createObjectURL(blob);

      link.download =
        'generated-character.gltf';

      link.click();

    }

  );

};

/*
==================================================
DEFAULT GENERATED CHARACTER
==================================================
*/

generateDefaultCharacter();

function generateDefaultCharacter() {

  /*
  approximated procedural mesh
  from supplied image
  */

  const geo =
    new THREE.CapsuleGeometry(
      18,
      70,
      10,
      20
    );

  const mat =
    new THREE.MeshStandardMaterial({

      color: 0x00ffaa,
      wireframe: false,
      transparent: true,
      opacity: .6

    });

  const mesh =
    new THREE.Mesh(
      geo,
      mat
    );

  mesh.userData.type =
    'face';

  faceGroup.add(mesh);

  /*
  wire overlay
  */

  const wire =
    new THREE.LineSegments(

      new THREE.WireframeGeometry(geo),

      new THREE.LineBasicMaterial({
        color: 0xffffff
      })

    );

  wire.userData.type =
    'edge';

  edgeGroup.add(wire);

  /*
  skeleton
  */

  createSkeleton();

}

/*
==================================================
RESIZE
==================================================
*/

window.addEventListener(
  'resize',
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

/*
==================================================
ANIMATE
==================================================
*/

function animate() {

  requestAnimationFrame(
    animate
  );

  controls.update();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
