<!DOCTYPE html>
<html lang="en">

<style>

html,body{
    margin:0;
    overflow:hidden;

}

canvas{
    display:block;

#hud{

<script type="module">

import * as THREE from 'https://esm.sh/three@0.165.0';
import { OrbitControls } from 'https://esm.sh/three@0.165.0/examples/jsm/controls/OrbitControls.js';

///////////////////////////////////////////////////////////
// SCENE
///////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(28,32,28);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.set(0,0,0);
controls.update();

///////////////////////////////////////////////////////////
// LIGHT
///////////////////////////////////////////////////////////

const sun = new THREE.DirectionalLight(
    0xffffff,
    2
);

sun.position.set(20,40,20);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.45
    )
);

///////////////////////////////////////////////////////////
// WORLD
///////////////////////////////////////////////////////////

const WORLD_SIZE = 64;

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(
        WORLD_SIZE,
        WORLD_SIZE,
        40,
        40
    ),

    new THREE.MeshStandardMaterial({
        color:0x467a46
    })
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);

///////////////////////////////////////////////////////////
// MATERIALS
///////////////////////////////////////////////////////////

const stoneMat = new THREE.MeshStandardMaterial({
    color:0x8c877f,
    roughness:0.95
});

const darkStoneMat = new THREE.MeshStandardMaterial({
    color:0x5d5851,
    roughness:1
});

const woodMat = new THREE.MeshStandardMaterial({
    color:0x6b4a2d,
    roughness:0.9
});

const roofMat = new THREE.MeshStandardMaterial({
    color:0x6f665b,
    roughness:1
});

const goldMat = new THREE.MeshStandardMaterial({
    color:0xffd348,
    emissive:0x9b6a00,
    emissiveIntensity:0.7,
    roughness:0.45,
    metalness:0.35
});

///////////////////////////////////////////////////////////
// TREES
///////////////////////////////////////////////////////////

const trees = [];

function spawnTree(x,z){

    const g = new THREE.Group();

    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2,0.3,2),
        new THREE.MeshStandardMaterial({
            color:0x6b4423
        })
    );

    trunk.castShadow = true;
    trunk.position.y = 1;

    const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.2,3,8),
        new THREE.MeshStandardMaterial({
            color:0x228833
        })
    );

    leaves.castShadow = true;
    leaves.position.y = 3;

    g.add(trunk);
    g.add(leaves);

    g.position.set(x,0,z);

    scene.add(g);

    trees.push(g);
}

for(let i=0;i<40;i++){

    spawnTree(
        Math.random()*50-25,
        Math.random()*50-25
    );
}

///////////////////////////////////////////////////////////
// PEASANT
///////////////////////////////////////////////////////////

let selectedObject = null;

const workers = [];

function createPeasant(){

    const g = new THREE.Group();

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(1,1.8,1),
        new THREE.MeshStandardMaterial({
            color:0xc9b07d
        })
    );

    body.castShadow = true;
    body.position.y = 1.2;

    const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.8,0.8,0.8),
        new THREE.MeshStandardMaterial({
            color:0xe0c090
        })
    );

    head.castShadow = true;
    head.position.y = 2.4;

    g.add(body);
    g.add(head);

    g.position.set(-8,0,-8);

    g.userData = {
        type:"peasant",
        hp:230,
        maxHp:230,
        target:null,
        speed:0.035
    };

    const ring = new THREE.Mesh(
        new THREE.RingGeometry(1.2,1.45,32),
        new THREE.MeshBasicMaterial({
            color:0x00ff00,
            side:THREE.DoubleSide
        })
    );

    ring.rotation.x = -Math.PI/2;
    ring.visible = false;

    g.add(ring);

    g.selectionRing = ring;

    scene.add(g);

    workers.push(g);

    return g;
}

const peasant = createPeasant();

///////////////////////////////////////////////////////////
// GOLDMINE
///////////////////////////////////////////////////////////

let goldmine;

function clearTreesNear(x,z,radius){

    for(let i=trees.length-1;i>=0;i--){

        const t = trees[i];

        const dx = t.position.x - x;
        const dz = t.position.z - z;

        if(Math.sqrt(dx*dx+dz*dz) < radius){

            scene.remove(t);

            trees.splice(i,1);
        }
    }
}

function addRock(group,x,y,z,sx,sy,sz,colorMat=stoneMat){

    const rock = new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        colorMat
    );

    rock.position.set(x,y,z);

    rock.rotation.y =
        Math.random()*0.2;

    rock.rotation.z =
        (Math.random()-0.5)*0.1;

    rock.castShadow = true;
    rock.receiveShadow = true;

    group.add(rock);
}

function createRoofTiles(group){

    const tileMat = new THREE.MeshStandardMaterial({
        color:0x8b8171,
        roughness:1
    });

    for(let y=0;y<7;y++){

        for(let x=0;x<5;x++){

            const tile = new THREE.Mesh(
                new THREE.BoxGeometry(
                    0.42,
                    0.08,
                    0.52
                ),
                tileMat
            );

            tile.position.set(
                -1 + x*0.5,
                5.55 - y*0.1,
                1.2 + y*0.28
            );

            tile.rotation.x =
                -Math.PI*0.18;

            tile.castShadow = true;

            group.add(tile);
        }
    }
}

function createMineTracks(group){

    for(let i=0;i<7;i++){

        const plank = new THREE.Mesh(
            new THREE.BoxGeometry(
                2.8,
                0.12,
                0.45
            ),
            woodMat
        );

        plank.position.set(
            0,
            0.08,
            -1.8 + i*0.7
        );

        plank.castShadow = true;

        group.add(plank);
    }

    for(let r=-0.45;r<=0.45;r+=0.9){

        const rail = new THREE.Mesh(
            new THREE.BoxGeometry(
                0.12,
                0.12,
                5
            ),
            darkStoneMat
        );

        rail.position.set(
            r,
            0.16,
            0.4
        );

        rail.castShadow = true;

        group.add(rail);
    }
}

function createGoldmine(){

    const x = 18;
    const z = 18;

    clearTreesNear(x,z,10);

    const g = new THREE.Group();

    //////////////////////////////////////////////////////
    // BASE PLATFORM
    //////////////////////////////////////////////////////

    const base = new THREE.Mesh(
        new THREE.BoxGeometry(
            12,
            1.2,
            10
        ),
        darkStoneMat
    );

    base.position.y = 0.6;

    base.castShadow = true;
    base.receiveShadow = true;

    g.add(base);

    //////////////////////////////////////////////////////
    // CLIFF ROCKS
    //////////////////////////////////////////////////////

    addRock(g,-4,3,-1,4,6,5);
    addRock(g,4,4,-1,5,8,6);
    addRock(g,0,5,-3,6,5,5);
    addRock(g,5,3,3,4,6,4);
    addRock(g,-5,2,3,4,5,4);

    //////////////////////////////////////////////////////
    // GOLD VEINS
    //////////////////////////////////////////////////////

    for(let i=0;i<8;i++){

        const gold = new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                0.8 + Math.random()*0.4
            ),
            goldMat
        );

        gold.position.set(
            -1 + Math.random()*2,
            5 + Math.random()*2,
            -1 + Math.random()*2
        );

        gold.rotation.set(
            Math.random()*Math.PI,
            Math.random()*Math.PI,
            Math.random()*Math.PI
        );

        gold.castShadow = true;

        g.add(gold);
    }

    //////////////////////////////////////////////////////
    // MINE ENTRANCE
    //////////////////////////////////////////////////////

    const entrance = new THREE.Group();

    const archLeft = new THREE.Mesh(
        new THREE.BoxGeometry(
            1,
            3.5,
            1
        ),
        stoneMat
    );

    archLeft.position.set(
        -1.5,
        1.75,
        2
    );

    const archRight =
        archLeft.clone();

    archRight.position.x = 1.5;

    const topArch = new THREE.Mesh(
        new THREE.BoxGeometry(
            4,
            1,
            1.2
        ),
        stoneMat
    );

    topArch.position.set(
        0,
        3.9,
        2
    );

    const tunnel = new THREE.Mesh(
        new THREE.BoxGeometry(
            2.8,
            2.8,
            3
        ),
        new THREE.MeshStandardMaterial({
            color:0x1b1b1b
        })
    );

    tunnel.position.set(
        0,
        1.6,
        1.6
    );

    entrance.add(
        archLeft,
        archRight,
        topArch,
        tunnel
    );

    entrance.traverse(o=>{

        if(o.isMesh){

            o.castShadow = true;
            o.receiveShadow = true;
        }
    });

    g.add(entrance);

    //////////////////////////////////////////////////////
    // ROOF
    //////////////////////////////////////////////////////

    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(
            5.2,
            0.5,
            4
        ),
        roofMat
    );

    roof.position.set(
        0,
        5,
        2
    );

    roof.rotation.x =
        -Math.PI*0.18;

    roof.castShadow = true;

    g.add(roof);

    createRoofTiles(g);

    //////////////////////////////////////////////////////
    // SUPPORT BEAMS
    //////////////////////////////////////////////////////

    const beam1 = new THREE.Mesh(
        new THREE.BoxGeometry(
            0.3,
            5,
            0.3
        ),
        woodMat
    );

    beam1.position.set(
        -2.6,
        3,
        2
    );

    beam1.rotation.z =
        Math.PI*0.18;

    beam1.castShadow = true;

    const beam2 = beam1.clone();
    beam2.position.x = 2.6;
    beam2.rotation.z = -Math.PI*0.18;

    g.add(beam1);
    g.add(beam2);

    //////////////////////////////////////////////////////
    // DECORATIVE TOWERS
    //////////////////////////////////////////////////////

    function makeTower(px,pz){

        const tower = new THREE.Group();

        const base = new THREE.Mesh(
            new THREE.BoxGeometry(
                1.6,
                2.5,
                1.6
            ),
            stoneMat
        );

        base.position.y = 1.25;

        const top = new THREE.Mesh(
            new THREE.ConeGeometry(
                0.9,
                1.2,
                4
            ),
            roofMat
        );

        top.position.y = 3.2;
        top.rotation.y =
            Math.PI*0.25;

        tower.add(base);
        tower.add(top);

        tower.position.set(
            px,
            0,
            pz
        );

        tower.traverse(o=>{

            if(o.isMesh){

                o.castShadow = true;
                o.receiveShadow = true;
            }
        });

        g.add(tower);
    }

    makeTower(-4.8,4);
    makeTower(4.8,4);
    makeTower(2.5,5.2);

    //////////////////////////////////////////////////////
    // TRACKS
    //////////////////////////////////////////////////////

    createMineTracks(g);

    //////////////////////////////////////////////////////
    // FOOTER BLOCKS
    //////////////////////////////////////////////////////

    for(let i=-5;i<=5;i++){

        const b = new THREE.Mesh(
            new THREE.BoxGeometry(
                1,
                0.8,
                1
            ),
            stoneMat
        );

        b.position.set(
            i,
            0.4,
            5.2
        );

        b.castShadow = true;

        g.add(b);
    }

    //////////////////////////////////////////////////////
    // SCALE & POSITION
    //////////////////////////////////////////////////////

    g.scale.set(
        0.9,
        0.9,
        0.9
    );

    g.position.set(
        x,
        0,
        z
    );

    g.userData = {
        type:"goldmine",
        gold:18000
    };

    //////////////////////////////////////////////////////
    // SELECTION RING
    //////////////////////////////////////////////////////

    const ring = new THREE.Mesh(
        new THREE.RingGeometry(
            6.5,
            6.9,
            64
        ),
        new THREE.MeshBasicMaterial({
            color:0xffff00,
            side:THREE.DoubleSide
        })
    );

    ring.rotation.x = -Math.PI/2;
    ring.visible = false;

    g.add(ring);

    g.selectionRing = ring;

    scene.add(g);

    return g;
}

goldmine = createGoldmine();

renderEmptyHUD();

///////////////////////////////////////////////////////////
// SELECT / DESELECT
///////////////////////////////////////////////////////////

function deselectAll(){

    selectedObject = null;

    peasant.selectionRing.visible = false;
    goldmine.selectionRing.visible = false;

    renderEmptyHUD();
}

window.addEventListener("keydown",(e)=>{

    if(e.key === "Escape"){

        deselectAll();
    }
});

///////////////////////////////////////////////////////////
// MOVEMENT
///////////////////////////////////////////////////////////

function movePeasant(){

    if(
        peasant.userData.target
    ){

        const target =
            peasant.userData.target;

        const dir =
            new THREE.Vector3()
            .subVectors(
                target,
                peasant.position
            );

        const dist = dir.length();

        if(dist > 0.1){

            dir.normalize();

            peasant.position.add(
                dir.multiplyScalar(
                    peasant.userData.speed
                )
            );
        }
    }
}

///////////////////////////////////////////////////////////
// INPUT
///////////////////////////////////////////////////////////

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    "mousedown",
    e=>{

    mouse.x =
        (e.clientX/window.innerWidth)*2-1;

    mouse.y =
        -(e.clientY/window.innerHeight)*2+1;

    raycaster.setFromCamera(
        mouse,
        camera
    );

    // LEFT CLICK
    if(e.button === 0){

        const hits =
            raycaster.intersectObjects(
                scene.children,
                true
            );

        if(hits.length){

            let obj =
                hits[0].object;

            while(
                obj.parent &&
                !obj.userData.type
            ){
                obj = obj.parent;
            }

            if(
                obj.userData.type ===
                "peasant"
            ){

                deselectAll();

                selectedObject = peasant;

                peasant.selectionRing
                .visible = true;

                renderPeasantHUD();

                return;
            }

            if(
                obj.userData.type ===
                "goldmine"
            ){

                deselectAll();

                selectedObject = goldmine;

                goldmine.selectionRing
                .visible = true;

                renderGoldmineHUD();

                return;
            }
        }

        deselectAll();
    }

    // RIGHT CLICK MOVE
    if(
        e.button === 2 &&
        selectedObject === peasant
    ){

        e.preventDefault();

        const hit =
            raycaster.intersectObject(
                ground
            );

        if(hit.length){

            peasant.userData.target =
                hit[0].point.clone();
        }
    }
});

window.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

///////////////////////////////////////////////////////////
// MINIMAP
///////////////////////////////////////////////////////////

const minimap =
    document.getElementById("minimap");

const mini =
    minimap.getContext("2d");

function mapToMini(v){

    return {
        x:(v.x/WORLD_SIZE)*200 + 100,
        y:(v.z/WORLD_SIZE)*200 + 100
    };
}

function updateMinimap(){

    mini.fillStyle = "#111";

    mini.fillRect(0,0,200,200);

    mini.strokeStyle = "#355a2c";

    mini.strokeRect(0,0,200,200);

    trees.forEach(t=>{

        const p =
            mapToMini(t.position);

        mini.fillStyle = "#228833";

        mini.fillRect(
            p.x,
            p.y,
            2,
            2
        );
    });

    const g =
        mapToMini(goldmine.position);

    mini.fillStyle = "#ffcc22";

    mini.beginPath();

    mini.arc(
        g.x,
        g.y,
        5,
        0,
        Math.PI*2
    );

    mini.fill();

    workers.forEach(w=>{

        const p =
            mapToMini(w.position);

        mini.fillStyle =
            selectedObject === w
            ? "#00ff66"
            : "#44aaff";

        mini.beginPath();

        mini.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        mini.fill();
    });
}

///////////////////////////////////////////////////////////
// LOOP
///////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    movePeasant();

    updateMinimap();

    renderer.render(
        scene,
        camera
    );
}

animate();

///////////////////////////////////////////////////////////
// RESIZE
///////////////////////////////////////////////////////////

window.addEventListener(
    "resize",
    ()=>{

    camera.aspect =
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>
