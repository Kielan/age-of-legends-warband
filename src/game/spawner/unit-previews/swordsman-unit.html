////////////////////////////////////////////////////////////
// MODEL BUILDER
////////////////////////////////////////////////////////////

const bones = {};

function buildNode(name,data){

    const group = new THREE.Group();

    bones[name] = group;

    if(data.pos)
        group.position.set(...data.pos);

    if(data.rot)
        group.rotation.set(...data.rot);

    if(data.geo){

        const g = data.geo;

        let geo;

        if(g[0]==="box"){
            geo = new THREE.BoxGeometry(
                g[1],g[2],g[3]
            );
        }

        if(g[0]==="cone"){
            geo = new THREE.ConeGeometry(
                g[1],g[2],g[3]
            );
        }

        if(g[0]==="cyl"){
            geo = new THREE.CylinderGeometry(
                g[1],g[2],g[3],g[4]
            );
        }

        const mesh = new THREE.Mesh(
            geo,
            MAT[data.mat]
        );

        mesh.castShadow = true;

        group.add(mesh);

        group.mesh = mesh;
    }

    if(data.children){

        for(const childName of data.children){

            const child = buildNode(
                childName,
                knightJSON[childName]
            );

            group.add(child);
        }
    }

    return group;
}

const knight = buildNode("root", knightJSON);

scene.add(knight);

////////////////////////////////////////////////////////////
// ANIMATION STATE
////////////////////////////////////////////////////////////

const anim = {
    state:"idle",
    time:0
};

////////////////////////////////////////////////////////////
// ANIMATION
////////////////////////////////////////////////////////////

function updateAnimation(dt){

    anim.time += dt;

    const t = anim.time;

    const BODY = bones.body;
    const CAPE = bones.cape;

    const LA = bones.leftArm;
    const RA = bones.rightArm;

    const LL = bones.leftLeg;
    const RL = bones.rightLeg;

    const HEAD = bones.head;

    //////////////////////////////////////////////////////////
    // RESET
    //////////////////////////////////////////////////////////

    BODY.rotation.z = 0;
    BODY.rotation.x = 0;

    //////////////////////////////////////////////////////////
    // IDLE
    //////////////////////////////////////////////////////////

    if(anim.state==="idle"){

        BODY.position.y = 5 + Math.sin(t*2)*0.08;

        HEAD.rotation.y = Math.sin(t)*0.08;

        CAPE.rotation.x = Math.sin(t*2)*0.05;

        LA.rotation.x = Math.sin(t*1.5)*0.04;
        RA.rotation.x = -Math.sin(t*1.5)*0.04;
    }

    //////////////////////////////////////////////////////////
    // RUN
    //////////////////////////////////////////////////////////

    if(anim.state==="run"){

        const swing = Math.sin(t*9);

        LL.rotation.x = swing * 0.9;
        RL.rotation.x = -swing * 0.9;

        LA.rotation.x = -swing * 0.7;
        RA.rotation.x = swing * 0.7;

        BODY.position.y = 5 + Math.abs(swing)*0.25;

        CAPE.rotation.x = 0.5 + Math.sin(t*10)*0.15;

        knight.position.x += 0.04;

        if(knight.position.x > 10)
            knight.position.x = -10;
    }

    //////////////////////////////////////////////////////////
    // ATTACK
    //////////////////////////////////////////////////////////

    if(anim.state==="attack"){

        const atk = Math.sin(t*12);

        RA.rotation.x = -2.0 + atk * 1.2;

        BODY.rotation.z = -0.12;

        LA.rotation.z = 0.3;

        CAPE.rotation.x = 0.4;

        if(atk > 0.7){

            BODY.rotation.z = -0.28;
        }
    }

    //////////////////////////////////////////////////////////
    // DIE
    //////////////////////////////////////////////////////////

    if(anim.state==="die"){

        knight.rotation.z = Math.min(
            Math.PI/2,
            knight.rotation.z + dt * 1.1
        );

        CAPE.rotation.x = 1.2;

        RA.rotation.x = -1;
        LA.rotation.x = 1;
    }

}

////////////////////////////////////////////////////////////
// KEY INPUT
////////////////////////////////////////////////////////////

window.addEventListener("keydown",e=>{

    if(e.key==="1"){
        anim.state="idle";
        knight.rotation.z = 0;
    }

    if(e.key==="2"){
        anim.state="run";
        knight.rotation.z = 0;
    }

    if(e.key==="3"){
        anim.state="attack";
        knight.rotation.z = 0;
    }

    if(e.key==="4"){
        anim.state="die";
    }

});

////////////////////////////////////////////////////////////
// CAMERA ORBIT
////////////////////////////////////////////////////////////

let camRot = 0;

////////////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////////////

const clock = new THREE.Clock();

function loop(){

    requestAnimationFrame(loop);

    const dt = clock.getDelta();

    camRot += dt * 0.32;

    camera.position.x = Math.sin(camRot)*15;
    camera.position.z = Math.cos(camRot)*15;

    camera.lookAt(0,5,0);

    updateAnimation(dt);

    renderer.render(scene,camera);
}

loop();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});

</script>
