    }
}
HEVertex._id = 0;

class HEFace {
    constructor(){
        this.edge = null;
        this.id = HEFace._id++;
    }
}
HEFace._id = 0;

class HEEdge {
    constructor(){
        this.vertex = null;
        this.face = null;
        this.next = null;
        this.prev = null;

    }

    constructor(){

    /* 
    Directed:0_1
    means exact direction.
    Undirected:0_1and1_0
    collapse to same key
    Useful for manifold detection.
    Now:
    registerEdge(edge);
    registerTwin(edge);
    instantly connects twins no repair pass

    makeDirectedKey(a,b){
        return `${a.id}_${b.id}`;
    }
    makeUndirectedKey(a,b){
        const ia = a.id;
        const ib = b.id;
        return ia < ib
            ? `${ia}_${ib}`
            : `${ib}_${ia}`;
    }
    registerEdge(edge){
        const start = edge.prev.vertex;
        const end = edge.vertex;
        const key = this.makeDirectedKey(
                        start,
                        end
                    );
        if(this.edgeRegistry.has(key)){
            console.warn("Duplicate edge",key);
        }
        this.edgeRegistry.set(
            key,
            edge);
    }
    unregisterEdge(edge){
        const start = edge.prev.vertex;
        const end = edge.vertex;
        const key = this.makeDirectedKey(start, end);
        this.edgeRegistry.delete(key);
    }
    rebuildEdgeRegistry(){
        this.edgeRegistry.clear();
        for(const e of this.edges){
            e.twin = null;
        }
        for(const e of this.edges){
            if(e.prev.vertex === e.vertex){
                continue;
            }
            this.registerEdge(e);
        }
        for(const e of this.edges){
            if(e.prev.vertex === e.vertex){
                continue;
            }
            this.registerTwin(e);
        }
    }
    registerTwin(edge){
        const start = edge.prev.vertex;
        const end = edge.vertex;
        const twinKey =
        this.makeDirectedKey(
            end,
            start
        );
        const twin =this.edgeRegistry.get(
            twinKey
        );
        if(twin){
            edge.twin = twin;
            twin.twin = edge;
        }
    }
    createEdge(){
        const e = new HEEdge();
        this.edges.push(e);
        return e;
    }
    getNextLoopEdge(edge){

        face.edge = edges[0];

        const orderedEdges = baseRing;
        const orderedVerts = orderedEdges.map(e => e.vertex);
        // STEP 2 — compute normal (stable)
        const normal = this.computeFaceNormal(face);
        //
        const a = orderedVerts[0].position;
        const b = orderedVerts[1].position;
        const c = orderedVerts[2].position;
        // (optional but consistent w earlier debugging)

        for (const v of orderedVerts) {

        }

        // FIX 2: stable duplication
        const dupVerts = orderedVerts.map(v => {

                v.position.x + offset.x,

                v.position.z + offset.z
            );
            this.vertices.push(nv);
            // important: traceability link
            nv.original = v;
            return nv;
        });
        // STEP 4. top face
        const topFace =
            this.createFaceFromVertices(dupVerts);
        // STEP 5. side faces
        /**
        for(let i=0;i<n;i++){
            const v0 = orderedVerts[i];

            );

        for(const e of this.edges){
            const start =
                e.prev.vertex.id;
            const end =
                e.vertex.id;
            const twinKey =
                end + "_" + start;
            if(map.has(twinKey)){
                e.twin =
                    map.get(twinKey);
            }
        }
    }
    repairTwins(){
        const map = new Map();
        const canonicalKey = (a, b) => {
            return a < b ? `${a}_${b}` : `${b}_${a}`;
        };
        // STEP 1: clear all twins
        for (const e of this.edges) {
            e.twin = null;
        }
        // STEP 2: build canonical edge registry
        for (const e of this.edges) {
            const a = e.prev.vertex.id;
            const b = e.vertex.id;
            const key = canonicalKey(a, b);
            if (!map.has(key)) {
                map.set(key, []);
            }
            map.get(key).push(e);
        }
        // STEP 3: assign twins
        for (const [key, list] of map.entries()) {
            if (list.length === 2) {
                const e0 = list[0];
                const e1 = list[1];
                e0.twin = e1;
                e1.twin = e0;
            }
            // optional debug safety
            if (list.length > 2) {
                console.warn("Non-manifold edge detected:", key, list);
            }
        }
    }
    computeFaceNormal(face){
        const verts = [];
        let e = face.edge;

        do {
            verts.push(e.vertex.position);
            e = e.next;
        } while (e !== face.edge);

        const ab = new THREE.Vector3().subVectors(verts[1], verts[0]);
        const ac = new THREE.Vector3().subVectors(verts[2], verts[0]);

        return new THREE.Vector3().crossVectors(ab, ac).normalize();
    }
    enforceConsistentWinding(){
        if (!this.faces.length) return;

        const visited = new Set();
        const stack = [];

        // start from face 0 as canonical orientation
        const seed = this.faces[0];
        stack.push(seed);
        visited.add(seed);

        while (stack.length) {
            const face = stack.pop();

            let e = face.edge;

            do {
                const twin = e.twin;

                if (twin && twin.face && !visited.has(twin.face)) {

                    const currentN = this.computeFaceNormal(face);
                    const neighborN = this.computeFaceNormal(twin.face);

                    // if normals disagree → flip neighbor
                    if (currentN.dot(neighborN) < 0) {
                        this.flipFaceWinding(twin.face);
                    }

                    visited.add(twin.face);
                    stack.push(twin.face);
                }

                e = e.next;

            } while (e !== face.edge);
        }
    }
    flipFaceWinding(face){
        const edges = [];

        let e = face.edge;
        do {
            edges.push(e);
            e = e.next;
        } while (e !== face.edge);

        // reverse cycle
        edges.reverse();

        for (let i = 0; i < edges.length; i++) {
            const curr = edges[i];
            const next = edges[(i + 1) % edges.length];
            const prev = edges[(i - 1 + edges.length) % edges.length];

            curr.next = next;
            curr.prev = prev;
        }

        face.edge = edges[0];
    }
    getFaceEdgeLoop(face){
        const loop = [];
        let start = face.edge;
        let e = start;
        do {
            loop.push(e);
            e = e.next;
        } while (e !== start);

        return loop;
    }
    weldVertex(position, epsilon=1e-6){
        for(const v of this.vertices){
            if(
                v.position.distanceTo(position)
                < epsilon
            ){
                return v;
            }
        }
        const nv =
            new HEVertex(
                position.x,
                position.y,
                position.z
            );
        this.vertices.push(nv);
        return nv;
    }
    findEdge(a,b){
        return this.edgeRegistry.get(
            this.makeDirectedKey(a,b)
        );
    }
}

class MeshSystem {
    constructor(scene){
        this.scene = scene;
        this.topology = new HalfEdgeMesh();
        this.topology.createCube(1);
        this.topology.repairTwins();
        this.topology.enforceConsistentWinding();
        this.createRenderMesh();
        this.selectedVertex = null;
        this.selectedFace = null;
        window.mesh = this.topology;
    }
    updateSelectedEdge(edge){
        if(!edge){
            this.selectedEdgeLine.visible=false;
            return;
        }
        this.selectedEdgeLine.visible=true;
        const a =
            edge.prev.vertex.position;
        const b =
            edge.vertex.position;
        const geo =
            new THREE.BufferGeometry();
        geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute([
                a.x,a.y,a.z,
                b.x,b.y,b.z
            ],3)
        );
        this.selectedEdgeLine.geometry.dispose();
        this.selectedEdgeLine.geometry =
            geo;
    }
    updateSelectedVertex(vertex){
        if(!vertex){
            this.selectedVertexPoint.visible=false;
            return;
        }
        this.selectedVertexPoint.visible=true;
        const p =
            vertex.position;
        const geo =
            new THREE.BufferGeometry();
        geo.setAttribute(
            "position",
            new THREE.Float32BufferAttribute([
                p.x,p.y,p.z
            ],3)
        );
        this.selectedVertexPoint.geometry.dispose();
        this.selectedVertexPoint.geometry =
            geo;
    }
    createRenderMesh(){
        this.selectedEdgeLine =
            new THREE.Line(
            new THREE.BufferGeometry(),
            new THREE.LineBasicMaterial({
                color:0xffff00
            })
        );
        this.scene.add(
            this.selectedEdgeLine
        );
        const geo = this.topology.buildGeometry();
        const mat = new THREE.MeshStandardMaterial({
            color:0x6688aa,
            side:THREE.DoubleSide
        });
        this.mesh = new THREE.Mesh(geo,mat);
        this.geometry = geo;
        this.scene.add(this.mesh);
        const edgeGeo = new THREE.EdgesGeometry(geo);
        this.edgeLines = new THREE.LineSegments(
            edgeGeo,
            new THREE.LineBasicMaterial({
                color:0xff66aa
            })
        );
        this.scene.add(this.edgeLines);
        const pointMat = new THREE.PointsMaterial({
            color:0xffffff,
            size:0.08,
            sizeAttenuation:true
        });
        this.points = new THREE.Points(geo,pointMat);
        this.scene.add(this.points);
        this.mesh.geometry = geo;

        this.edgeLines.geometry = geo;
        this.points.geometry = geo;

        this.highlightMesh = this.mesh.clone();
        this.highlightMesh.material = new THREE.MeshBasicMaterial({
            color:0xffaa00,
            transparent:true,
            opacity:0.5,
            side:THREE.DoubleSide
        });
        this.highlightMesh.visible = false;
        this.scene.add(this.highlightMesh);
        this.faceColors =new Float32Array(
            this.geometry.attributes.position.count * 3
        );
    }
    rebuild(){
        const geo =
            this.topology.buildGeometry();
        this.mesh.geometry = geo;
        this.edgeLines.geometry = geo;
        this.points.geometry = geo;
        this.geometry = geo;
    }
}

// APP
class EditorApp{
    constructor(){
    // "vertex" | "edge" | "face"
    this.selection = new Selection();
    this.initScene();
    this.initHelpers();
    this.animate();
    // window.mesh = this.topology;
    }
    pickEdge(ray){
        let bestEdge = null;
        let bestDistance = Infinity;
        const cpRay = new THREE.Vector3();
        const cpSeg = new THREE.Vector3();
        for(const edge of this.meshSystem.topology.edges){
            const a = edge.prev.vertex.position;
            const b = edge.vertex.position;
            ray.distanceSqToSegment(
                a,
                b,
                cpRay,
                cpSeg
            );
            const d = cpRay.distanceTo(cpSeg);
            if(d < 0.15 && d < bestDistance){
                bestDistance = d;
                bestEdge = edge;
            }
        }
        return bestEdge;
    }
    initScene(){
// var viewport =
//     document.getElementById("viewport");
// var stats =
//     document.getElementById("stats");

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x2a2a2a);
        this.camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
        );

        this.camera.position.set(4,4,6);
        this.renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

        this.renderer.setSize(
            viewport.clientWidth,
            viewport.clientHeight
        );

        viewport.appendChild(this.renderer.domElement);

        this.controls =
        new OrbitControls(
            this.camera,
            this.renderer.domElement
        );
        this.raycaster = new THREE.Raycaster();
        this.mouse = new THREE.Vector2();

        this.renderer.domElement.addEventListener("pointerdown",(e)=>{
            const rect = this.renderer.domElement.getBoundingClientRect();
            this.mouse.x = ((e.clientX - rect.left)/ rect.width) * 2 - 1;
            this.mouse.y = -((e.clientY - rect.top)/ rect.height) * 2 + 1;
            this.raycaster.setFromCamera(this.mouse,this.camera);
            const hits =this.raycaster.intersectObject(this.meshSystem.mesh);
            if(!hits.length) return;

            const hit = hits[0];
            if(this.selection.mode === "edge"){
                this.selection.clear();
                this.selection.edge =
                this.pickEdge(
                    this.raycaster.ray
                );
                return;
            }
            if(this.selection.mode === "vertex"){
                this.selection.clear();
                this.selection.vertex =
                this.pickVertex(
                    this.raycaster.ray
                );
                return;
            }
            if(this.selection.mode === "face"){
                const face =
                this.meshSystem.geometry.userData.faceMap[
                hit.faceIndex
                ];
                this.selection.face = face;
            console.log("FACE:", hit.faceIndex);
            }
        });

        window.addEventListener("keydown",(e)=>{
        if(e.key === "e"){
        const face =
            APP.selection.face;
        if(!face) return;
        APP.meshSystem.topology.extrudeFace(face);
        APP.meshSystem.topology.validateFaces();
        APP.meshSystem.rebuild();
        }
        });
    }
    initHelpers(){
        const grid =new THREE.GridHelper(50,50);
        this.scene.add(grid);
        const axes =new THREE.AxesHelper(2);
        this.scene.add(axes);
        const ambient = new THREE.AmbientLight(0xffffff,1);
        this.scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff,2);
        sun.position.set(10,10,5);
        this.scene.add(sun);
        this.meshSystem = new MeshSystem(this.scene);
     }
    updateSelectionVisual(){
        this.meshSystem.updateSelectedVertex(this.selection.vertex)
        if(!this.meshSystem ||
            !this.meshSystem.highlightMesh){
            return;
        }
        const face = this.selection.face;
        if(!face){
        this.meshSystem.highlightMesh.visible = false;
        return;
        }
        this.meshSystem.highlightMesh.visible = true;
    }
    animate(){
    requestAnimationFrame(()=>this.animate());
    this.controls.update();
    this.renderer.render(this.scene,this.camera);
    this.updateSelectionVisual();
    }
}
