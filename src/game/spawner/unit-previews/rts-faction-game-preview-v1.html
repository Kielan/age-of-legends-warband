<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Faction Prototype - PS1/PS2 Style Game Preview</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

/* GLOBAL */
*{
    box-sizing:border-box;
}

/* LEFT MENU */
#menu{
    position:absolute;
    top:0;
    left:0;
    width:300px;
    height:100vh;
    background:#111;
    color:white;
    overflow-y:auto;
    overflow-x:hidden;
    border-right:2px solid #333;
    z-index:20;
}

/* RIGHT PANEL */
#selectionPanel{
    position:absolute;
    top:0;
    right:0;
    width:280px;
    height:100vh;
    background:#141414;
    color:white;
    border-left:2px solid #333;
    overflow-y:auto;
    overflow-x:hidden;
    z-index:20;
}

/* BOTTOM UI */
#ui{
    position:absolute;
    left:300px;
    right:280px;
    bottom:0;
    height:90px;
    background:#000;
    color:white;
    padding:10px;
    border-top:2px solid #333;
    z-index:30;
}

/* SECTIONS */
.section{
    padding:10px;
    border-bottom:1px solid #222;
}

.selectionCard{
    padding:10px;
    border-bottom:1px solid #222;
}

/* BUTTONS */
button{
    width:100%;
    padding:8px;
    margin:4px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    cursor:pointer;
    text-align:left;
    font-family:monospace;
}

button:hover{
    background:#333;
}

/* ACTIVE FACTION */
.activeFaction{
    background:#355a2c;
    border-color:#7fcf5f;
}

/* CANVAS */
canvas{
    position:absolute;
    top:0;
    left:300px;
    width:calc(100vw - 580px) !important;
    height:100vh !important;
    display:block;
}

</style>
</head>

<body>

<div id="menu"></div>

<div id="selectionPanel">

    <div class="selectionCard">
        <h3>Selection</h3>
        <div id="selectedInfo">None</div>
    </div>

</div>

<div id="ui">
RTS Neutral Unit Prototype - PS1/PS2 Style
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";

////////////////////////////////////////////////////////////
// SAFE CHECK
////////////////////////////////////////////////////////////

if(typeof THREE === "undefined"){

    alert("THREE failed to load.");
    throw new Error("THREE failed");
}

////////////////////////////////////////////////////////////
// VIEW CONSTANTS
////////////////////////////////////////////////////////////

const LEFT_W = 300;
const RIGHT_W = 280;

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101014);

scene.fog = new THREE.Fog(
    0x101014,
    40,
    180
);

const VIEW_W =
    window.innerWidth - LEFT_W - RIGHT_W;

const VIEW_H =
    window.innerHeight;

const camera = new THREE.PerspectiveCamera(
    60,
    VIEW_W / VIEW_H,
    0.1,
    2000
);

camera.position.set(45,35,45);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.shadowMap.enabled = true;

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    VIEW_W,
    VIEW_H
);

renderer.domElement.style.position = "absolute";
renderer.domElement.style.left = LEFT_W + "px";
renderer.domElement.style.top = "0px";

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.7
    )
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.8
);

sun.position.set(50,80,40);

sun.castShadow = true;

scene.add(sun);

////////////////////////////////////////////////////////////
// APP STATE
////////////////////////////////////////////////////////////

const AppState = {

    selectedFaction:"kobold"

};

////////////////////////////////////////////////////////////
// FACTIONS
////////////////////////////////////////////////////////////

const Factions = {

    human:{

        name:"Human",

        buildings:[
            {
                id:"human-keep",
                name:"Keep"
            },
            {
                id:"human-barracks",
                name:"Barracks"
            },
            {
                id:"human-workshop",
                name:"Workshop"
            },
            {
                id:"human-altar",
                name:"Altar"
            }
        ],

        units:[
            {
                id:"human-peon",
                name:"Peon"
            },
            {
                id:"human-knight",
                name:"Knight"
            },
            {
                id:"human-rifleman",
                name:"Rifleman"
            }
        ]
    },

    goblin:{

        name:"Goblin",

        buildings:[
            {
                id:"goblin-den",
                name:"Chieftains Den"
            },
            {
                id:"goblin-workshop",
                name:"Workshop"
            },
            {
                id:"goblin-tower",
                name:"Tower"
            }
        ],

        units:[
            {
                id:"goblin-whip",
                name:"Goblin Taskmaster"
            },
            {
                id:"wolf-rider",
                name:"Goblin Wolf Rider"
            }
        ]
    },

    kobold:{

        name:"Neutral",

        buildings:[
            {
                id:"kobold-gnoll-camp",
                name:"Gnoll Camp"
            },
            {
                id:"kobold-mine",
                name:"Kobold Mine"
            },
            {
                id:"kobold-watch-tower",
                name:"Watch Tower"
            }
        ],

        units:[
            {
                id:"kobold",
                name:"Kobold Miner"
            },
            {
                id:"gnoll",
                name:"Gnoll Brute"
            },
            {
                id:"goblin-whip",
                name:"Goblin Taskmaster"
            },
            {
                id:"wolf-rider",
                name:"Goblin Wolf Rider"
            }
        ]
    }

};

////////////////////////////////////////////////////////////
// MENU
////////////////////////////////////////////////////////////

const menu =
    document.getElementById("menu");

function renderMenu(){

    const faction =
        Factions[AppState.selectedFaction];

    ////////////////////////////////////////////////////////
    // FACTION BUTTONS
    ////////////////////////////////////////////////////////

    const factionButtons =
        Object.entries(Factions)
        .map(([id,data])=>{

            const active =
                id === AppState.selectedFaction;

            return `
            <button
                class="${active ? "activeFaction" : ""}"
                onclick="selectFaction('${id}')"
            >
                ${active ? "■" : "□"}
                ${data.name}
            </button>
            `;
        })
        .join("");

    ////////////////////////////////////////////////////////
    // BUILDINGS
    ////////////////////////////////////////////////////////

    const buildingButtons =
        faction.buildings
        .map(building=>{

            return `
            <button
                onclick="spawnFactionBuilding('${building.id}')"
            >
                ${building.name}
            </button>
            `;
        })
        .join("");

    ////////////////////////////////////////////////////////
    // UNITS
    ////////////////////////////////////////////////////////

    const unitButtons =
        faction.units
        .map(unit=>{

            return `
            <button
                onclick="spawnRaceUnit('${unit.id}')"
            >
                ${unit.name}
            </button>
            `;
        })
        .join("");

    ////////////////////////////////////////////////////////
    // FINAL
    ////////////////////////////////////////////////////////

    menu.innerHTML = `

    <div class="section">
        <h2>${faction.name} Faction</h2>
    </div>

    <div class="section">

        <h3>Factions</h3>

        ${factionButtons}

    </div>

    <div class="section">

        <h3>Buildings</h3>

        ${buildingButtons}

    </div>

    <div class="section">

        <h3>Units</h3>

        ${unitButtons}

    </div>

    `;
}

window.selectFaction = function(id){

    AppState.selectedFaction = id;

    renderMenu();
};

renderMenu();

////////////////////////////////////////////////////////////
// GROUND
////////////////////////////////////////////////////////////

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(240,240),

    new THREE.MeshStandardMaterial({
        color:0x355a2c
    })
);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);

////////////////////////////////////////////////////////////
// MATERIALS
////////////////////////////////////////////////////////////

const MAT = {

    kobold:new THREE.MeshStandardMaterial({
        color:0xd59c72,
        flatShading:true
    }),

    gnoll:new THREE.MeshStandardMaterial({
        color:0xc89b53,
        flatShading:true
    }),

    goblin:new THREE.MeshStandardMaterial({
        color:0x6fa04e,
        flatShading:true
    }),

    wolf:new THREE.MeshStandardMaterial({
        color:0x555555,
        flatShading:true
    }),

    dark:new THREE.MeshStandardMaterial({
        color:0x2a2118,
        flatShading:true
    }),

    steel:new THREE.MeshStandardMaterial({
        color:0xd0d8e0,
        metalness:0.7,
        roughness:0.4,
        flatShading:true
    }),

    wood:new THREE.MeshStandardMaterial({
        color:0x6f4c2d,
        flatShading:true
    }),

    roof:new THREE.MeshStandardMaterial({
        color:0x4c2b18,
        flatShading:true
    })

};

////////////////////////////////////////////////////////////
// HELPERS
////////////////////////////////////////////////////////////

function box(w,h,d,mat){

    const m = new THREE.Mesh(

        new THREE.BoxGeometry(w,h,d),

        mat
    );

    m.castShadow = true;
    m.receiveShadow = true;

    return m;
}

function cone(r,h,s,mat){

    const m = new THREE.Mesh(

        new THREE.ConeGeometry(r,h,s),

        mat
    );

    m.castShadow = true;

    return m;
}

// UNITS

const units = [];

// KOBOLD

function createKobold(){

    const g = new THREE.Group();

    const body =
        box(1.2,1.8,1,MAT.kobold);

    body.position.y = 2;

    g.add(body);

    const head =
        box(1.3,1.1,1.5,MAT.kobold);

    head.position.set(0,3.3,0.3);

    g.add(head);

    g.userData.type = "Kobold Miner";

    return g;
}

// GNOLL

function createGnoll(){

    const g = new THREE.Group();

    const torso =
        box(2.2,3,1.6,MAT.gnoll);

    torso.position.y = 3.5;

    g.add(torso);

    g.userData.type = "Gnoll Brute";

    return g;
}

// GOBLIN TASKMASTER

function createGoblinWhip(){

    const g = new THREE.Group();

    const body =
        box(1.4,2.1,1,MAT.goblin);

    body.position.y = 2.5;

    g.add(body);

    g.userData.type = "Goblin Taskmaster";

    return g;
}

// WOLF RIDER

function createWolfRider(){

    const g = new THREE.Group();

    const wolf =
        box(3.8,1.8,1.4,MAT.wolf);

    wolf.position.y = 2;

    g.add(wolf);

    g.userData.type = "Goblin Wolf Rider";

    return g;
}

// BUILDINGS

function createGnollCamp(){

    const g = new THREE.Group();

    const base =
        box(8,4,8,MAT.wood);

    base.position.y = 2;

    g.add(base);

    const roof =
        cone(6,4,4,MAT.roof);

    roof.position.y = 6;

    g.add(roof);

    g.userData.type = "Gnoll Camp";

    return g;
}

function createKoboldMine(){

    const g = new THREE.Group();

    const cave =
        box(8,5,6,MAT.dark);

    cave.position.y = 2.5;

    g.add(cave);

    g.userData.type = "Kobold Mine";

    return g;
}

function createWatchTower(){

    const g = new THREE.Group();

    const tower =
        box(3,10,3,MAT.wood);

    tower.position.y = 5;

    g.add(tower);

    g.userData.type = "Watch Tower";

    return g;
}

// SPAWN UNITS

window.spawnRaceUnit = function(type){

    let unit;

    if(type==="kobold")
        unit = createKobold();

    if(type==="gnoll")
        unit = createGnoll();

    if(type==="goblin-whip")
        unit = createGoblinWhip();

    if(type==="wolf-rider")
        unit = createWolfRider();

    if(!unit) return;

    unit.position.set(

        (Math.random()-0.5)*50,

        0,

        (Math.random()-0.5)*50
    );

    scene.add(unit);

    units.push(unit);
};

// SPAWN BUILDINGS

window.spawnFactionBuilding = function(type){

    let b;

    if(type==="kobold-gnoll-camp")
        b = createGnollCamp();

    if(type==="kobold-mine")
        b = createKoboldMine();

    if(type==="kobold-watch-tower")
        b = createWatchTower();

    if(!b) return;

    b.position.set(

        (Math.random()-0.5)*60,

        0,

        (Math.random()-0.5)*60
    );

    scene.add(b);
};

// INITIAL SPAWNS

spawnRaceUnit("kobold");
spawnRaceUnit("gnoll");
spawnRaceUnit("goblin-whip");
spawnRaceUnit("wolf-rider");

spawnFactionBuilding("kobold-gnoll-camp");
spawnFactionBuilding("kobold-mine");
spawnFactionBuilding("kobold-watch-tower");

// SELECTION

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener("pointerdown",(e)=>{

    const rect =
        renderer.domElement.getBoundingClientRect();

    mouse.x =
        ((e.clientX - rect.left)/rect.width)*2-1;

    mouse.y =
        -((e.clientY - rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits =
        raycaster.intersectObjects(
            scene.children,
            true
        );

    if(hits.length){

        let obj = hits[0].object;

        while(
            obj.parent &&
            !obj.userData.type
        ){
            obj = obj.parent;
        }

        if(obj.userData.type){

            document.getElementById(
                "selectedInfo"
            ).innerHTML = obj.userData.type;
        }
    }
});

// CAMERA

let angle = 0;

function animate(){

    requestAnimationFrame(animate);

    angle += 0.0015;

    camera.position.x =
        Math.cos(angle)*55;

    camera.position.z =
        Math.sin(angle)*55;

    camera.lookAt(0,6,0);

    renderer.render(scene,camera);
}

animate();

// RESIZE

window.addEventListener("resize",()=>{

    const W =
        window.innerWidth - LEFT_W - RIGHT_W;

    const H =
        window.innerHeight;

    camera.aspect = W/H;

    camera.updateProjectionMatrix();

    renderer.setSize(W,H);

});

</script>

</body>
</html>
