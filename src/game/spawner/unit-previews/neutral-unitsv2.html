```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Faction Editor - Drag Drop Safe - neutralunitsv2</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

#menu{
    position:absolute;
    top:0;
    left:0;
    width:300px;
    height:100%;
    background:#111;
    color:white;
    overflow:auto;
    border-right:2px solid #333;
    z-index:10;
}

.section{
    padding:10px;
    border-bottom:1px solid #222;
}

button{
    width:100%;
    padding:8px;
    margin:4px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    cursor:pointer;
    text-align:left;
}

button:hover{
    background:#333;
}

#selectionPanel{
    position:absolute;
    top:0;
    right:0;
    width:280px;
    height:100%;
    background:#141414;
    color:white;
    border-left:2px solid #333;
    overflow:auto;
    z-index:10;
}

.selectionCard{
    padding:10px;
    border-bottom:1px solid #222;
}

#ui{
    position:absolute;
    bottom:0;
    left:300px;
    right:280px;
    height:90px;
    background:#000;
    color:white;
    padding:10px;
    border-top:2px solid #333;
    z-index:10;
}

canvas{
    position:absolute;
    top:0;
    left:300px;
}

</style>
</head>

<body>

<div id="menu"></div>

<div id="selectionPanel">

<div class="selectionCard">
<h3>Selection</h3>
<div id="selectedInfo">None</div>
</div>

<div class="selectionCard">

<button onclick="spawnRaceUnit('kobold')">
Spawn Kobold
</button>

<button onclick="spawnRaceUnit('gnoll')">
Spawn Gnoll
</button>

</div>

</div>

<div id="ui">
RTS Neutral Unit Prototype
</div>

<script type="module">
import * as THREE from "https://esm.sh/three@0.165.0";
// SAFE CHECK

if(typeof THREE === "undefined"){

    alert(
        "ThreeJS failed to load. Internet connection or CDN blocked."
    );

    throw new Error("THREE failed");
}

// SCENE

const LEFT_W = 300;
const RIGHT_W = 280;

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x0b0b0b);

const VIEW_W = window.innerWidth - LEFT_W - RIGHT_W;

const camera = new THREE.PerspectiveCamera(
    60,
    VIEW_W / window.innerHeight,
    0.1,
    2000
);

camera.position.set(45,35,45);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.shadowMap.enabled = true;

renderer.setSize(
    VIEW_W,
    window.innerHeight
);

renderer.domElement.style.left = LEFT_W + "px";

document.body.appendChild(renderer.domElement);

// LIGHTS

scene.add(
    new THREE.AmbientLight(0xffffff,0.7)
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.6
);

sun.position.set(40,70,30);

scene.add(sun);

// GROUND

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(240,240),

    new THREE.MeshStandardMaterial({
        color:0x355a2c
    })
);

ground.rotation.x = -Math.PI/2;

scene.add(ground);

// MATERIALS

const MAT = {

kobold:new THREE.MeshStandardMaterial({
    color:0xd6a07d,
    flatShading:true
}),

gnoll:new THREE.MeshStandardMaterial({
    color:0xc89b53,
    flatShading:true
}),

dark:new THREE.MeshStandardMaterial({
    color:0x2b2118,
    flatShading:true
}),

steel:new THREE.MeshStandardMaterial({
    color:0xc7d2dc,
    metalness:0.7,
    roughness:0.4,
    flatShading:true
}),

wood:new THREE.MeshStandardMaterial({
    color:0x6f4c2d,
    flatShading:true
})

};


// MENU

const menu = document.getElementById("menu");

menu.innerHTML = `

<div class="section">
<h2>Faction Menu</h2>
</div>

<div class="section">

<button>[ ] Human</button>
<button>[ ] Goblin</button>
<button>[x] Neutral</button>

</div>

<div class="section">
<h3>Buildings</h3>

<button>Gnoll Camp</button>
<button>Kobold Mine</button>
<button>Watch Tower</button>

</div>

<div class="section">
<h3>Neutral Units</h3>

<button onclick="spawnRaceUnit('kobold')">
Kobold Miner
</button>

<button onclick="spawnRaceUnit('gnoll')">
Gnoll Brute
</button>

</div>

`;

// HELPERS

function box(w,h,d,mat){

    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );

    m.castShadow = true;

    return m;
}

const units = [];

// KOBOLD

function createKobold(){

    const g = new THREE.Group();

    const body = box(1.2,1.8,1,MAT.kobold);
    body.position.y = 2;
    g.add(body);

    const head = box(1.3,1.1,1.5,MAT.kobold);
    head.position.set(0,3.3,0.3);
    g.add(head);

    const snout = box(0.7,0.4,1,MAT.kobold);
    snout.position.set(0,3.1,1.1);
    g.add(snout);

    const earL = box(0.2,0.8,0.2,MAT.kobold);
    earL.position.set(-0.6,3.9,0);
    earL.rotation.z = -0.5;
    g.add(earL);

    const earR = earL.clone();
    earR.position.x = 0.6;
    earR.rotation.z = 0.5;
    g.add(earR);

    const pickHandle = box(0.12,2,0.12,MAT.wood);
    pickHandle.position.set(1.1,1.7,0);
    pickHandle.rotation.z = 1.1;
    g.add(pickHandle);

    const pickHead = box(1,0.15,0.15,MAT.steel);
    pickHead.position.set(1.5,2.4,0);
    g.add(pickHead);

    for(let i=-1;i<=1;i+=2){

        const leg = box(0.35,1.3,0.35,MAT.kobold);

        leg.position.set(i*0.3,0.7,0);

        g.add(leg);
    }

    g.userData.type = "Kobold Miner";

    return g;
}

// GNOLL

function createGnoll(){

    const g = new THREE.Group();

    const torso = box(2.2,3,1.6,MAT.gnoll);

    torso.position.y = 3.5;

    g.add(torso);

    const hump = box(2,1.1,1.6,MAT.dark);

    hump.position.set(0,5,-0.4);

    hump.rotation.x = 0.4;

    g.add(hump);

    const head = box(1.5,1.2,1.8,MAT.gnoll);

    head.position.set(0,4.6,1.1);

    g.add(head);

    const jaw = box(1.2,0.5,1.3,MAT.dark);

    jaw.position.set(0,4,1.8);

    g.add(jaw);

    const hammerHandle = box(0.18,3.4,0.18,MAT.wood);

    hammerHandle.position.set(1.8,2.8,0);

    hammerHandle.rotation.z = 0.7;

    g.add(hammerHandle);

    const hammerHead = box(1,0.7,0.7,MAT.steel);

    hammerHead.position.set(2.8,4.1,0);

    g.add(hammerHead);

    for(let i=-1;i<=1;i+=2){

        const leg = box(0.6,2.2,0.6,MAT.gnoll);

        leg.position.set(i*0.65,1.1,0);

        g.add(leg);
    }

    g.userData.type = "Gnoll Brute";

    return g;
}

// SPAWN

window.spawnRaceUnit = function(type){

    let unit;

    if(type === "kobold")
        unit = createKobold();

    if(type === "gnoll")
        unit = createGnoll();

    unit.position.set(
        (Math.random()-0.5)*40,
        0,
        (Math.random()-0.5)*40
    );

    scene.add(unit);

    units.push(unit);
};

spawnRaceUnit("kobold");
spawnRaceUnit("gnoll");

// SELECTION

const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

window.addEventListener("pointerdown",(e)=>{

    const rect = renderer.domElement.getBoundingClientRect();

    mouse.x =
        ((e.clientX - rect.left)/rect.width)*2-1;

    mouse.y =
        -((e.clientY - rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(
        scene.children,
        true
    );

    if(hits.length){

        let obj = hits[0].object;

        while(obj.parent && !obj.userData.type){

            obj = obj.parent;
        }

        if(obj.userData.type){

            document.getElementById(
                "selectedInfo"
            ).innerHTML = obj.userData.type;
        }
    }
});

// CAMERA

let angle = 0;

function animate(){

    requestAnimationFrame(animate);

    angle += 0.0015;

    camera.position.x = Math.cos(angle)*55;
    camera.position.z = Math.sin(angle)*55;

    camera.lookAt(0,5,0);

    renderer.render(scene,camera);
}

animate();

// RESIZE

window.addEventListener("resize",()=>{

    const W =
        window.innerWidth - LEFT_W - RIGHT_W;

    camera.aspect = W / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        W,
        window.innerHeight
    );
});

</script>

</body>
</html>
