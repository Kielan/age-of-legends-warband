<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Faction Editor - Kobolds & Gnolls</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
}

#menu{
    position:absolute;
    top:0;
    left:0;
    width:300px;
    height:100%;
    background:#111;
    color:white;
    overflow:auto;
    border-right:2px solid #333;
}

.section{
    padding:10px;
    border-bottom:1px solid #222;
}

button{
    width:100%;
    padding:8px;
    margin:4px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    cursor:pointer;
    text-align:left;
}

button:hover{
    background:#333;
}

#selectionPanel{
    position:absolute;
    top:0;
    right:0;
    width:280px;
    height:100%;
    background:#141414;
    color:white;
    border-left:2px solid #333;
    overflow:auto;
}

#selectionPanel h3{
    margin:0;
    padding:10px;
    border-bottom:1px solid #222;
}

.selectionCard{
    padding:10px;
    border-bottom:1px solid #222;
}

.unitBtn{
    background:#1d1d1d;
}

#ui{
    position:absolute;
    bottom:0;
    left:300px;
    right:280px;
    height:120px;
    background:#000;
    color:white;
    padding:10px;
    border-top:2px solid #333;
    font-size:12px;
}

.info{
    color:#8fd6ff;
}

</style>
</head>

<body>

<div id="menu"></div>

<div id="selectionPanel">

<h3>Unit Selection</h3>

<div class="selectionCard">
<div class="info">Selected Unit</div>
<div id="selectedInfo">None</div>
</div>

<div class="selectionCard">
<div class="info">Spawn Unit</div>

<button class="unitBtn" onclick="spawnRaceUnit('kobold')">
Spawn Kobold
</button>

<button class="unitBtn" onclick="spawnRaceUnit('gnoll')">
Spawn Gnoll
</button>
</div>

</div>

<div id="ui">
RTS Unit Editor Prototype
</div>

<script src="https://unpkg.com/three@0.165.0/build/three.min.js">

import * as THREE from "https://esm.sh/three@0.165.0";

// SCENE
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0b0b,40,180);

const camera = new THREE.PerspectiveCamera(
    60,
    (innerWidth-580)/innerHeight,
    0.1,
    2000
);

camera.position.set(45,35,45);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.shadowMap.enabled = true;

renderer.setSize(innerWidth-580, innerHeight);

renderer.domElement.style.marginLeft = "300px";

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////

scene.add(
    new THREE.AmbientLight(0xffffff,0.6)
);

const sun = new THREE.DirectionalLight(0xffffff,1.5);

sun.position.set(40,60,30);
sun.castShadow = true;

scene.add(sun);

////////////////////////////////////////////////////////////
// GROUND
////////////////////////////////////////////////////////////

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(240,240),

    new THREE.MeshStandardMaterial({
        color:0x355a2c
    })
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;

scene.add(ground);

////////////////////////////////////////////////////////////
// MATERIALS
////////////////////////////////////////////////////////////

const MAT = {

koboldSkin:new THREE.MeshStandardMaterial({
    color:0xd49b7b,
    flatShading:true
}),

koboldCloth:new THREE.MeshStandardMaterial({
    color:0x557733,
    flatShading:true
}),

koboldHair:new THREE.MeshStandardMaterial({
    color:0xe8e1b2,
    flatShading:true
}),

gnollFur:new THREE.MeshStandardMaterial({
    color:0xc89b53,
    flatShading:true
}),

gnollDark:new THREE.MeshStandardMaterial({
    color:0x302214,
    flatShading:true
}),

steel:new THREE.MeshStandardMaterial({
    color:0xc8d0d8,
    metalness:0.7,
    roughness:0.4,
    flatShading:true
}),

wood:new THREE.MeshStandardMaterial({
    color:0x6b4828,
    flatShading:true
}),

leather:new THREE.MeshStandardMaterial({
    color:0x5a3d21,
    flatShading:true
})

};

////////////////////////////////////////////////////////////
// FACTIONS
////////////////////////////////////////////////////////////

const Factions = {

human:{
    name:"Human",
    buildings:["Keep","Barracks","Workshop","Altar"]
},

goblin:{
    name:"Goblin",
    buildings:[
        "Chieftains Den",
        "House",
        "Barracks",
        "Workshop",
        "Altar",
        "Shaman Hut",
        "Tower"
    ]
},

neutral:{
    name:"Neutral",
    buildings:[
        "Gnoll Camp",
        "Kobold Mine",
        "Mercenary Tent",
        "Watch Tower"
    ]
}

};

let selectedFaction = "neutral";

////////////////////////////////////////////////////////////
// MENU
////////////////////////////////////////////////////////////

const menu = document.getElementById("menu");

function renderMenu(){

menu.innerHTML = `

<div class="section">
<h2>Faction Editor</h2>
</div>

<div class="section">

<b>Faction Menu</b>

<button onclick="selectFaction('human')">
[ ] Human
</button>

<button onclick="selectFaction('goblin')">
[ ] Goblin
</button>

<button onclick="selectFaction('neutral')">
[ ] Neutral
</button>

</div>

<div class="section">

<b>Selected</b>

<div style="padding-top:8px;color:#8fd6ff;">
${Factions[selectedFaction].name}
</div>

</div>

<div class="section">

<b>Buildings</b>

${Factions[selectedFaction].buildings
.map(b=>`<button>${b}</button>`)
.join("")}

</div>

<div class="section">

<b>Neutral Units</b>

<button onclick="spawnRaceUnit('kobold')">
Spawn Kobold Miner
</button>

<button onclick="spawnRaceUnit('gnoll')">
Spawn Gnoll Brute
</button>

</div>

`;

}

window.selectFaction = (f)=>{

selectedFaction = f;

renderMenu();

};

renderMenu();

////////////////////////////////////////////////////////////
// UNIT HELPERS
////////////////////////////////////////////////////////////

const units = [];

function makeBox(w,h,d,mat){

    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );

    m.castShadow = true;

    return m;
}

////////////////////////////////////////////////////////////
// KOBOLD
////////////////////////////////////////////////////////////

function createKobold(){

    const g = new THREE.Group();

    ////////////////////////////////////////////////////////
    // BODY
    ////////////////////////////////////////////////////////

    const body = makeBox(
        1.2,1.8,1,
        MAT.koboldSkin
    );

    body.position.y = 2.2;

    g.add(body);

    ////////////////////////////////////////////////////////
    // HEAD
    ////////////////////////////////////////////////////////

    const head = makeBox(
        1.3,1.2,1.6,
        MAT.koboldSkin
    );

    head.position.set(0,3.6,0.3);

    g.add(head);

    ////////////////////////////////////////////////////////
    // SNOUT
    ////////////////////////////////////////////////////////

    const snout = makeBox(
        0.8,0.45,1.1,
        MAT.koboldSkin
    );

    snout.position.set(0,3.3,1.1);

    g.add(snout);

    ////////////////////////////////////////////////////////
    // BEARD
    ////////////////////////////////////////////////////////

    const beard = new THREE.Mesh(

        new THREE.ConeGeometry(0.45,1.4,5),

        MAT.koboldHair
    );

    beard.position.set(0,2.6,0.9);

    g.add(beard);

    ////////////////////////////////////////////////////////
    // EARS
    ////////////////////////////////////////////////////////

    const earL = makeBox(
        0.25,0.9,0.25,
        MAT.koboldSkin
    );

    earL.rotation.z = -0.5;

    earL.position.set(-0.65,4.1,0);

    g.add(earL);

    const earR = earL.clone();

    earR.rotation.z = 0.5;

    earR.position.x = 0.65;

    g.add(earR);

    ////////////////////////////////////////////////////////
    // BACKPACK
    ////////////////////////////////////////////////////////

    const pack = makeBox(
        1.2,1.2,0.8,
        MAT.leather
    );

    pack.position.set(0,2.6,-0.9);

    g.add(pack);

    ////////////////////////////////////////////////////////
    // PICKAXE
    ////////////////////////////////////////////////////////

    const handle = makeBox(
        0.12,2.2,0.12,
        MAT.wood
    );

    handle.rotation.z = 1.1;

    handle.position.set(1.1,1.7,0);

    g.add(handle);

    const pick = makeBox(
        1.1,0.18,0.18,
        MAT.steel
    );

    pick.position.set(1.55,2.5,0);

    pick.rotation.z = 0.2;

    g.add(pick);

    ////////////////////////////////////////////////////////
    // LEGS
    ////////////////////////////////////////////////////////

    for(let i=-1;i<=1;i+=2){

        const leg = makeBox(
            0.4,1.4,0.4,
            MAT.koboldSkin
        );

        leg.position.set(i*0.35,0.8,0);

        g.add(leg);
    }

    ////////////////////////////////////////////////////////
    // TAIL
    ////////////////////////////////////////////////////////

    const tail = makeBox(
        0.2,1.8,0.2,
        MAT.koboldSkin
    );

    tail.position.set(0,1.4,-0.9);

    tail.rotation.x = 0.9;

    g.add(tail);

    g.userData.type = "Kobold Miner";

    return g;
}

////////////////////////////////////////////////////////////
// GNOLL
////////////////////////////////////////////////////////////

function createGnoll(){

    const g = new THREE.Group();

    ////////////////////////////////////////////////////////
    // TORSO
    ////////////////////////////////////////////////////////

    const torso = makeBox(
        2.3,3.2,1.7,
        MAT.gnollFur
    );

    torso.position.y = 3.5;

    g.add(torso);

    ////////////////////////////////////////////////////////
    // HUNCH
    ////////////////////////////////////////////////////////

    const hump = makeBox(
        2.1,1.2,1.8,
        MAT.gnollDark
    );

    hump.position.set(0,5.2,-0.4);

    hump.rotation.x = 0.4;

    g.add(hump);

    ////////////////////////////////////////////////////////
    // HEAD
    ////////////////////////////////////////////////////////

    const head = makeBox(
        1.6,1.3,2,
        MAT.gnollFur
    );

    head.position.set(0,4.8,1.2);

    g.add(head);

    ////////////////////////////////////////////////////////
    // JAWS
    ////////////////////////////////////////////////////////

    const jaw = makeBox(
        1.3,0.6,1.5,
        MAT.gnollDark
    );

    jaw.position.set(0,4.1,2);

    g.add(jaw);

    ////////////////////////////////////////////////////////
    // EARS
    ////////////////////////////////////////////////////////

    const earL = makeBox(
        0.3,0.8,0.2,
        MAT.gnollDark
    );

    earL.position.set(-0.7,5.7,1);

    earL.rotation.z = -0.6;

    g.add(earL);

    const earR = earL.clone();

    earR.position.x = 0.7;
    earR.rotation.z = 0.6;

    g.add(earR);

    ////////////////////////////////////////////////////////
    // HAMMER
    ////////////////////////////////////////////////////////

    const hammerHandle = makeBox(
        0.2,3.6,0.2,
        MAT.wood
    );

    hammerHandle.position.set(1.8,2.8,0);

    hammerHandle.rotation.z = 0.7;

    g.add(hammerHandle);

    const hammerHead = makeBox(
        1,0.7,0.7,
        MAT.steel
    );

    hammerHead.position.set(2.8,4.2,0);

    g.add(hammerHead);

    ////////////////////////////////////////////////////////
    // LEGS
    ////////////////////////////////////////////////////////

    for(let i=-1;i<=1;i+=2){

        const leg = makeBox(
            0.7,2.4,0.7,
            MAT.gnollFur
        );

        leg.position.set(i*0.65,1.2,0);

        g.add(leg);
    }

    ////////////////////////////////////////////////////////
    // FEET
    ////////////////////////////////////////////////////////

    const footL = makeBox(
        0.9,0.3,1.1,
        MAT.gnollDark
    );

    footL.position.set(-0.65,0.1,0.3);

    g.add(footL);

    const footR = footL.clone();

    footR.position.x = 0.65;

    g.add(footR);

    g.userData.type = "Gnoll Brute";

    return g;
}

////////////////////////////////////////////////////////////
// SPAWN
////////////////////////////////////////////////////////////

window.spawnRaceUnit = (type)=>{

    let unit;

    if(type === "kobold")
        unit = createKobold();

    if(type === "gnoll")
        unit = createGnoll();

    unit.position.set(
        (Math.random()-0.5)*40,
        0,
        (Math.random()-0.5)*40
    );

    scene.add(unit);

    units.push(unit);
};

////////////////////////////////////////////////////////////
// INITIAL UNITS
////////////////////////////////////////////////////////////

spawnRaceUnit("kobold");
spawnRaceUnit("gnoll");

////////////////////////////////////////////////////////////
// RAYCAST SELECTION
////////////////////////////////////////////////////////////

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("pointerdown",(e)=>{

    const rect = renderer.domElement.getBoundingClientRect();

    mouse.x = (
        (e.clientX - rect.left)
        / rect.width
    ) * 2 - 1;

    mouse.y = -(
        (e.clientY - rect.top)
        / rect.height
    ) * 2 + 1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(
        scene.children,
        true
    );

    if(hits.length){

        let obj = hits[0].object;

        while(obj.parent && !obj.userData.type){

            obj = obj.parent;
        }

        if(obj.userData.type){

            document.getElementById(
                "selectedInfo"
            ).innerHTML = `
                <b>${obj.userData.type}</b>
            `;
        }
    }

});

////////////////////////////////////////////////////////////
// CAMERA ORBIT
////////////////////////////////////////////////////////////

let angle = 0;

function animate(){

    requestAnimationFrame(animate);

    angle += 0.0015;

    camera.position.x = Math.cos(angle)*55;
    camera.position.z = Math.sin(angle)*55;

    camera.lookAt(0,6,0);

    renderer.render(scene,camera);
}

animate();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

addEventListener("resize",()=>{

    camera.aspect =
        (innerWidth-580)/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth-580,
        innerHeight
    );

});

</script>
</body>
</html>
