<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Units: Mech + Rifleman</title>
<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }
#ui {
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:#000;
    color:white;
    font-family:sans-serif;
    font-size:12px;
    padding:6px;
}
</style>
</head>
<body>

<div id="ui"></div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
camera.position.set(80,80,80);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

const light = new THREE.DirectionalLight(0xffffff,1);
scene.add(light);

////////////////////////////////////////////////////////////
// GROUND
////////////////////////////////////////////////////////////

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({color:0x2d5a2d})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

////////////////////////////////////////////////////////////
// UNIT FACTORY
////////////////////////////////////////////////////////////

const units = [];

function createUnit(type,x,z,isEnemy=false){

    const stats = {

        rifleman:{
            hp:150,
            armor:4,
            dmg:[10,15],
            range:18,
            color:0xcccccc
        },

        mech:{
            hp:500,
            armor:5,
            dmg:[10,15],
            range:10,
            color:0x666666
        }
    };

    const s = stats[type];

    const mesh = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.6,1.2),
        new THREE.MeshStandardMaterial({color:s.color})
    );

    mesh.position.set(x,0,z);
    scene.add(mesh);

    units.push({
        type,
        mesh,
        enemy:isEnemy,
        hp:s.hp,
        armor:s.armor,
        dmg:s.dmg,
        range:s.range,
        cooldown:0,
        target:null
    });
}

////////////////////////////////////////////////////////////
// SPAWN TEST ARMIES
////////////////////////////////////////////////////////////

for(let i=0;i<4;i++){
    createUnit("rifleman",-10+i*2,0,false);
}

for(let i=0;i<2;i++){
    createUnit("mech",-12+i*4,-6,false);
}

for(let i=0;i<6;i++){
    createUnit("rifleman",20+i*2,10,true);
}

////////////////////////////////////////////////////////////
// DAMAGE SYSTEM (ARMOR REDUCTION)
// ////////////////////////////////////////////////////////////

function dealDamage(attacker,target){

    const base = attacker.dmg[0] + Math.random()*(attacker.dmg[1]-attacker.dmg[0]);

    const reduced = base * (100/(100 + target.armor*10));

    target.hp -= reduced;

    if(target.hp <= 0){
        scene.remove(target.mesh);
        units.splice(units.indexOf(target),1);
    }
}

////////////////////////////////////////////////////////////
// AI SYSTEM (ROLE BASED)
// ////////////////////////////////////////////////////////////

function nearestEnemy(u){

    let best=null;
    let dist=999;

    for(const o of units){
        if(o.enemy === u.enemy) continue;

        const d = u.mesh.position.distanceTo(o.mesh.position);

        if(d < dist){
            dist = d;
            best = o;
        }
    }

    return best;
}

function updateUnit(u){

    const enemy = nearestEnemy(u);

    if(!enemy) return;

    const dist = u.mesh.position.distanceTo(enemy.mesh.position);

    // ranged behavior
    if(dist < u.range){

        if(u.cooldown<=0){
            dealDamage(u,enemy);
            u.cooldown = 60;
        }

    } else {

        const dir = enemy.mesh.position.clone().sub(u.mesh.position).normalize();

        // mech slower advance (heavy unit feel)
        const speed = u.type === "mech" ? 0.2 : 0.4;

        u.mesh.position.add(dir.multiplyScalar(speed));
    }

    u.cooldown--;
}

////////////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////////////

function animate(){

    requestAnimationFrame(animate);

    for(const u of units){
        updateUnit(u);
    }

    renderer.render(scene,camera);
}

animate();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

addEventListener("resize",()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
