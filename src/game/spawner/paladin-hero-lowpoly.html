// BUILD MODEL

const bones = {};

function buildNode(name,data){

    const group = new THREE.Group();

    bones[name] = group;

    if(data.pos)
        group.position.set(...data.pos);

    if(data.rot)
        group.rotation.set(...data.rot);

    ////////////////////////////////////////////////////////
    // GEOMETRY
    ////////////////////////////////////////////////////////

    if(data.geo){

        let mesh;
        const g = data.geo;

        if(g[0] === "box"){

            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(g[1],g[2],g[3]),
                MAT[data.mat]
            );
        }

        if(g[0] === "cone"){

            mesh = new THREE.Mesh(
                new THREE.ConeGeometry(g[1],g[2],g[3]),
                MAT[data.mat]
            );
        }

        if(g[0] === "cyl"){

            mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(g[1],g[2],g[3],g[4]),
                MAT[data.mat]
            );
        }

        mesh.castShadow = true;

        group.add(mesh);

        group.mesh = mesh;
    }

    ////////////////////////////////////////////////////////
    // CHILDREN
    ////////////////////////////////////////////////////////

    if(data.children){

        for(const childName of data.children){

            const child = buildNode(
                childName,
                paladinJSON[childName]
            );

            group.add(child);
        }
    }

    return group;
}

const paladin = buildNode("root",paladinJSON.root);

scene.add(paladin);

////////////////////////////////////////////////////////////
// HOLY PARTICLES
////////////////////////////////////////////////////////////

const particles = [];

for(let i=0;i<16;i++){

    const p = new THREE.Mesh(

        new THREE.SphereGeometry(0.06,4,4),

        new THREE.MeshBasicMaterial({
            color:0x88aaff
        })
    );

    scene.add(p);

    particles.push({
        mesh:p,
        angle:Math.random()*Math.PI*2,
        radius:1.6 + Math.random()*1.4,
        speed:0.5 + Math.random()
    });
}

////////////////////////////////////////////////////////////
// ANIMATION STATE
////////////////////////////////////////////////////////////

const anim = {
    state:"idle",
    time:0
};

////////////////////////////////////////////////////////////
// UPDATE ANIMATION
////////////////////////////////////////////////////////////

function updateAnimation(dt){

    anim.time += dt;

    const t = anim.time;

    const LL = bones.leftLeg;
    const RL = bones.rightLeg;
    const LA = bones.leftArm;
    const RA = bones.rightArm;
    const CAPE = bones.cape;
    const BODY = bones.pelvis;
    const AURA = bones.holyAura;

    ////////////////////////////////////////////////////////
    // PARTICLES
    ////////////////////////////////////////////////////////

    particles.forEach(p=>{

        p.angle += dt * p.speed;

        p.mesh.position.set(
            Math.cos(p.angle)*p.radius,
            0.4 + Math.sin(t*2+p.angle)*0.2,
            Math.sin(p.angle)*p.radius
        );
    });

    ////////////////////////////////////////////////////////
    // RESET
    ////////////////////////////////////////////////////////

        // LL.rotation.x = 0;
            // RL.rotation.x = 0;
                // LA.rotation.x = 0;
                    // RA.rotation.x = 0;

    ////////////////////////////////////////////////////////
    // IDLE
    ////////////////////////////////////////////////////////

    if(anim.state === "idle"){

        // BODY.position.y = 4 + Math.sin(t*2)*0.06;

        // CAPE.rotation.x =
            // 0.2 + Math.sin(t*2)*0.05;

        // AURA.mesh.material.emissiveIntensity =
            // 1.5 + Math.sin(t*3)*0.5;
    }

    ////////////////////////////////////////////////////////
    // RUN
    ////////////////////////////////////////////////////////

    if(anim.state === "run"){

        const swing = Math.sin(t*10);

        LL.rotation.x = swing * 0.9;
        RL.rotation.x = -swing * 0.9;

        LA.rotation.x = -swing * 0.5;
        RA.rotation.x = swing * 0.5;

        BODY.position.y =
            4 + Math.abs(Math.sin(t*10))*0.25;

        CAPE.rotation.x =
            0.8 + Math.sin(t*12)*0.15;

        paladin.position.x += 0.045;

        if(paladin.position.x > 12)
            paladin.position.x = -12;
    }

    ////////////////////////////////////////////////////////
    // ATTACK
    ////////////////////////////////////////////////////////

    if(anim.state === "attack"){

        const atk = Math.sin(t*10);

        RA.rotation.z = -1.4 + atk*0.8;
        RA.rotation.x = -0.6;

        BODY.rotation.y = atk*0.2;

        if(atk > 0.7){

            AURA.mesh.scale.setScalar(
                1.2 + atk*0.2
            );
        }
    }

    ////////////////////////////////////////////////////////
    // CAST
    ////////////////////////////////////////////////////////

    if(anim.state === "cast"){

        LA.rotation.z = -1;
        RA.rotation.z = 1;

        BODY.position.y =
            4 + Math.sin(t*8)*0.2;

        AURA.mesh.scale.setScalar(
            1.5 + Math.sin(t*12)*0.25
        );

        AURA.mesh.material.emissiveIntensity =
            4;
    }

    ////////////////////////////////////////////////////////
    // DIE
    ////////////////////////////////////////////////////////

    if(anim.state === "die"){

        paladin.rotation.z = Math.min(
            Math.PI/2,
            paladin.rotation.z + 0.015
        );

        CAPE.rotation.x = 1;
    }

}

////////////////////////////////////////////////////////////
// CONTROLS
////////////////////////////////////////////////////////////

window.addEventListener("keydown",e=>{

    if(e.key==="1")
        anim.state="idle";

    if(e.key==="2")
        anim.state="run";

    if(e.key==="3")
        anim.state="attack";

    if(e.key==="4")
        anim.state="cast";

    if(e.key==="5")
        anim.state="die";

});

////////////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////////////

const clock = new THREE.Clock();

let camRot = 0;

function loop(){

    requestAnimationFrame(loop);

    const dt = clock.getDelta();

    camRot += dt * 0.2;

    camera.position.x = Math.sin(camRot)*14;
    camera.position.z = Math.cos(camRot)*14;

    camera.lookAt(0,5,0);

    updateAnimation(dt);

    renderer.render(scene,camera);
}

loop();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect = innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});
