<script type="module">

import * as THREE from 'https://esm.sh/three@0.165.0';
import { OrbitControls } from 'https://esm.sh/three@0.165.0/examples/jsm/controls/OrbitControls.js';

// BASIC ENGINE SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const WORLD_SIZE = 64;
const WORLD_HALF = WORLD_SIZE / 2;

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(25, 30, 25);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

controls.target.set(0, 0, 0);
controls.update();

// LIGHTING
const sun = new THREE.DirectionalLight(0xffffff, 2);

sun.position.set(20, 40, 20);
sun.castShadow = true;

scene.add(sun);

scene.add(new THREE.AmbientLight(0xffffff, 0.45));

// GLOBALS
const workers = [];
const selectedUnits = [];
const buildings = [];
const projectiles = [];
const enemies = [];
const goldMines = [];

// BIOMES
class ChunkBiomes {
    constructor(size = 32) {
        this.size = size;
        this.heightMap = [];
        for (let z = 0; z < size; z++) {
            this.heightMap[z] = [];
            for (let x = 0; x < size; x++) {
                const height =
                    Math.sin(x * 0.18) * 1.5 +
                    Math.cos(z * 0.21) * 1.5 +
                    Math.random() * 0.3;
                this.heightMap[z][x] = height;
            }
        }
    }

    getHeight(x, z) {

        const gx = Math.floor(x + this.size / 2);
        const gz = Math.floor(z + this.size / 2);

        if (
            gx < 0 ||
            gz < 0 ||
            gx >= this.size ||
            gz >= this.size
        ) {
            return 0;
        }

        return this.heightMap[gz][gx];
    }
}

// WORLD GEN
class WorldGenerator {
    constructor(biomes) {
        this.biomes = biomes;
    }
    getGroundHeight(x, z) {
        return this.biomes.getHeight(x, z);
    }
}

// GRID SYSTEM
class GridManager {
    constructor() {
        this.mode = 'square';
        // unified spacing
        this.tileSize = 2;
        this.hexRadius = 1.15;
    }

    setMode(mode) {
        this.mode = mode;
        regenerateGround();
    }

    // SNAP TO CELL CENTER
    snapPosition(pos) {

        // SQUARE
        if (this.mode === 'square') {

            const snappedX =
                Math.floor(pos.x / this.tileSize)
                * this.tileSize
                + this.tileSize * 0.5;

            const snappedZ =
                Math.floor(pos.z / this.tileSize)
                * this.tileSize
                + this.tileSize * 0.5;

            return new THREE.Vector3(
                snappedX,
                pos.y,
                snappedZ
            );
        }

        // HEX
        const size = this.hexRadius;

        const q =
            (Math.sqrt(3)/3 * pos.x - 1/3 * pos.z)
            / size;

        const r =
            (2/3 * pos.z)
            / size;

        const rq = Math.round(q);
        const rr = Math.round(r);

        const x =
            size * Math.sqrt(3) * (rq + rr/2);

        const z =
            size * 1.5 * rr;

        return new THREE.Vector3(
            x,
            pos.y,
            z
        );
    }
}

// OBJECT SPAWNER
class ObjectSpawner {
    constructor(scene, occupancyGrid) {
        this.scene = scene;
        this.occupancyGrid = occupancyGrid;
    }

    occupyTile(x, z, radius = 1) {

        for (let dz = -radius; dz <= radius; dz++) {
            for (let dx = -radius; dx <= radius; dx++) {

                const key = `${x+dx},${z+dz}`;

                this.occupancyGrid.add(key);
            }
        }
    }

    isOccupied(x, z, radius = 1) {

        for (let dz = -radius; dz <= radius; dz++) {
            for (let dx = -radius; dx <= radius; dx++) {

                const key = `${x+dx},${z+dz}`;

                if (this.occupancyGrid.has(key)) {
                    return true;
                }
            }
        }
        return false;
    }

    spawnTree(position) {

        const group = new THREE.Group();
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3,0.4,2),
            new THREE.MeshStandardMaterial({
                color: 0x6b4423
            })
        );
        trunk.position.y = 1;
        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 3, 8),
            new THREE.MeshStandardMaterial({
                color: 0x228833
            })
        );
        leaves.position.y = 3;
        group.add(trunk);
        group.add(leaves);
        group.position.copy(position);
        this.scene.add(group);
        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }

    spawnRock(position) {
        const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.9),
            new THREE.MeshStandardMaterial({
                color: 0x777777
            })
        );
        rock.position.copy(position);
        this.scene.add(rock);
        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }

    spawnHouse(position) {

        const group = new THREE.Group();

        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.6,2,1.6),
            new THREE.MeshStandardMaterial({
                color: 0xb07b4f
            })
        );

        body.position.y = 1;

        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(1.5,1.7,4),
            new THREE.MeshStandardMaterial({
                color: 0x7d1e1e
            })
        );

        roof.rotation.y = Math.PI / 4;
        roof.position.y = 3;

        group.add(body);
        group.add(roof);

        group.position.copy(position);

        this.scene.add(group);

        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }
}

// DRAFT PLACEMENT
class DraftConstructionPlacement {

    constructor(scene, spawner) {

        this.scene = scene;
        this.spawner = spawner;

        this.active = false;

        this.preview = this.createPreview();

        this.scene.add(this.preview);
    }

    createPreview() {

        const group = new THREE.Group();

        const mat = new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0.55
        });

        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.6,2,1.6),
            mat
        );

        body.position.y = 1;

        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(1.5,1.7,4),
            mat
        );

        roof.rotation.y = Math.PI / 4;
        roof.position.y = 3;

        group.add(body);
        group.add(roof);

        group.visible = false;

        return group;
    }

    start() {
        this.active = true;
        this.preview.visible = true;
    }

    cancel() {
        this.active = false;
        this.preview.visible = false;
    }

    update(position) {

        if (!this.active) return;

        this.preview.position.copy(position);

        const occupied =
            this.spawner.isOccupied(
                Math.round(position.x),
                Math.round(position.z),
                1
            );

        const color =
            occupied
                ? 0xff3333
                : 0x33ff66;

        this.preview.traverse(child => {

            if (child.material) {
                child.material.color.setHex(color);
            }
        });

        this.allowed = !occupied;
    }

    confirm() {
        if (!this.active) return;
        if (this.allowed) {
            this.spawner.spawnHouse(
                this.preview.position.clone()
            );
        }
    }
}

// WORLD
const occupancyGrid = new Set();

const biomes = new ChunkBiomes(64);

const worldGen = new WorldGenerator(biomes);

const gridManager = new GridManager();

const spawner = new ObjectSpawner(scene, occupancyGrid);

const draftPlacement =
    new DraftConstructionPlacement(scene, spawner);

// GROUND
let groundMesh = null;

function regenerateGround() {

    if (groundMesh) {
        scene.remove(groundMesh);
    }

    const segments = 63;

    const geo = new THREE.PlaneGeometry(
        WORLD_SIZE,
        WORLD_SIZE,
        segments,
        segments
    );

    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;

    for (let i = 0; i < pos.count; i++) {

        const x = pos.getX(i);
        const z = pos.getZ(i);

        const y =
            worldGen.getGroundHeight(x, z);

        pos.setY(i, y);
    }

    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
        color:
            gridManager.mode === 'square'
                ? 0x467a46
                : 0x587048
    });

    groundMesh = new THREE.Mesh(geo, mat);

    groundMesh.receiveShadow = true;

    scene.add(groundMesh);

    generateGridOverlay();
}

// TERRAIN GRID
let gridHelper = null;

const GRID_HEIGHT_OFFSET = 0.08;

function terrainHeight(x, z) {

    return (
        worldGen.getGroundHeight(x, z)
        + GRID_HEIGHT_OFFSET
    );
}

function createTerrainLine(points, color) {

    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints(points);

    const material =
        new THREE.LineBasicMaterial({
            color,
            transparent: true,
            opacity: 0.9,
            depthWrite: false
        });

    const line =
        new THREE.Line(geometry, material);

    line.renderOrder = 999;

    return line;
}

// GRID GENERATION
function generateGridOverlay() {

    if (gridHelper) {
        scene.remove(gridHelper);
    }

    const group = new THREE.Group();

    // SQUARE GRID
    if (gridManager.mode === 'square') {

        const step = gridManager.tileSize;

        for (
            let x = -WORLD_HALF;
            x <= WORLD_HALF;
            x += step
        ) {

            const points = [];

            for (
                let z = -WORLD_HALF;
                z <= WORLD_HALF;
                z += 0.5
            ) {

                points.push(
                    new THREE.Vector3(
                        x,
                        terrainHeight(x, z),
                        z
                    )
                );
            }

            group.add(
                createTerrainLine(points, 0x444444)
            );
        }

        for (
            let z = -WORLD_HALF;
            z <= WORLD_HALF;
            z += step
        ) {

            const points = [];

            for (
                let x = -WORLD_HALF;
                x <= WORLD_HALF;
                x += 0.5
            ) {

                points.push(
                    new THREE.Vector3(
                        x,
                        terrainHeight(x, z),
                        z
                    )
                );
            }

            group.add(
                createTerrainLine(points, 0x444444)
            );
        }

    // HEX GRID
    } else {

        // MATCH SQUARE CELL DENSITY
        const radius =
            gridManager.hexRadius;

        const horizontalSpacing =
            Math.sqrt(3) * radius;

        const verticalSpacing =
            1.5 * radius;

        // STRETCH FULL MAP
        const qMin =
            Math.floor(
                -WORLD_HALF / horizontalSpacing
            ) - 8;

        const qMax =
            Math.ceil(
                WORLD_HALF / horizontalSpacing
            ) + 8;

        const rMin =
            Math.floor(
                -WORLD_HALF / verticalSpacing
            ) - 8;

        const rMax =
            Math.ceil(
                WORLD_HALF / verticalSpacing
            ) + 8;

        for (let q = qMin; q <= qMax; q++) {
            for (let r = rMin; r <= rMax; r++) {

                const centerX =
                    radius *
                    Math.sqrt(3) *
                    (q + r / 2);

                const centerZ =
                    radius *
                    1.5 *
                    r;

                // CULL FAR OUTSIDE
                if (
                    centerX < -WORLD_HALF - 4 ||
                    centerX > WORLD_HALF + 4 ||
                    centerZ < -WORLD_HALF - 4 ||
                    centerZ > WORLD_HALF + 4
                ) {
                    continue;
                }

                const points = [];

                for (let i = 0; i <= 6; i++) {

                    const angle =
                        (Math.PI / 3) * i;

                    const x =
                        centerX +
                        radius * Math.cos(angle);

                    const z =
                        centerZ +
                        radius * Math.sin(angle);

                    points.push(
                        new THREE.Vector3(
                            x,
                            terrainHeight(x, z),
                            z
                        )
                    );
                }

                group.add(
                    createTerrainLine(points, 0x333333)
                );
            }
        }
    }

    gridHelper = group;

    scene.add(gridHelper);
}

// ENVIRONMENT
function spawnEnvironment() {

    for (let i = 0; i < 45; i++) {

        const x =
            Math.random() * 50 - 25;

        const z =
            Math.random() * 50 - 25;

        const y =
            worldGen.getGroundHeight(x, z);

        spawner.spawnTree(
            new THREE.Vector3(x, y, z)
        );
    }

    for (let i = 0; i < 20; i++) {

        const x =
            Math.random() * 50 - 25;

        const z =
            Math.random() * 50 - 25;

        const y =
            worldGen.getGroundHeight(x, z);

        spawner.spawnRock(
            new THREE.Vector3(x, y + 0.4, z)
        );
    }
}

// INPUT
const raycaster = new THREE.Raycaster();

const mouse = new THREE.Vector2();

window.addEventListener('mousemove', e => {

    mouse.x =
        (e.clientX / window.innerWidth) * 2 - 1;

    mouse.y =
        -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const hits =
        raycaster.intersectObject(groundMesh);

    if (hits.length > 0) {

        const hit = hits[0];

        const snapped =
            gridManager.snapPosition(hit.point);

        snapped.y =
            worldGen.getGroundHeight(
                snapped.x,
                snapped.z
            );

        draftPlacement.update(snapped);
    }
});

window.addEventListener('mousedown', e => {

    if (e.button === 0) {

        if (draftPlacement.active) {
            draftPlacement.confirm();
        }
    }

    if (e.button === 2) {

        e.preventDefault();

        draftPlacement.cancel();
    }
});

window.addEventListener('contextmenu', e => {
    e.preventDefault();
});

// DAY / NIGHT SYSTEM (10 MIN CYCLE)
const DAY_LENGTH = 600;

function updateDayNight(t){

    const cycle = (t % DAY_LENGTH) / DAY_LENGTH;

    const sunAngle = cycle * Math.PI * 2;

    sunLight.position.set(
        Math.cos(sunAngle)*100,
        Math.sin(sunAngle)*100,
        50
    );

    const intensity = Math.max(0.2, Math.sin(sunAngle)+0.5);

    sunLight.intensity = intensity;
    ambient.intensity = intensity * 0.4;

    return cycle;
}

}

// MINIMAP
const minimap = document.getElementById("minimap");

const mini =
    minimap.getContext("2d");

function updateMinimap(){

    mini.fillStyle = "#1a1a1a";
    mini.fillRect(0,0,220,220);

    buildings.forEach(b=>{

        mini.fillStyle = "#888";

        mini.fillRect(
            110 + b.mesh.position.x,
            110 + b.mesh.position.z,
            5,
            5
        );
    });

    workers.forEach(w=>{

        mini.fillStyle =
            w.selected ? "#00ffff" : "#3366ff";

        mini.fillRect(
            110 + w.mesh.position.x,
            110 + w.mesh.position.z,
            3,
            3
        );
    });

    enemies.forEach(e=>{

        mini.fillStyle = "#ff3333";

        mini.fillRect(
            110 + e.mesh.position.x,
            110 + e.mesh.position.z,
            4,
            4
        );
    });

    goldMines.forEach(m=>{

        mini.fillStyle = "#ffcc22";

        mini.beginPath();

        mini.arc(
            110 + m.position.x,
            110 + m.position.z,
            4,
            0,
            Math.PI*2
        );

        mini.fill();
    });
}

// INITIALIZE
regenerateGround();

spawnEnvironment();

// RENDER LOOP
function animate() {

    requestAnimationFrame(animate);
    
    updateMinimap();

    renderer.render(scene, camera);
}

animate();

// RESIZE
window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});
