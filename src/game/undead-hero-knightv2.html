<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Low Poly Death Knight Hero</title>

<style>
body{ margin:0; overflow:hidden; background:#050505; font-family:monospace; }
canvas{ display:block; }
#ui{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    background:#000c;
    padding:12px;
    line-height:1.7em;
}
</style>
</head>

<body>

<div id="ui">
1 = Idle<br>
2 = Run<br>
3 = Attack<br>
4 = Die
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";

////////////////////////////////////////////////////////////
// SCENE
////////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x050505,20,60);

const camera = new THREE.PerspectiveCamera(
    60,
    innerWidth/innerHeight,
    0.1,
    1000
);

camera.position.set(0,8,18);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////

scene.add(new THREE.AmbientLight(0xffffff,0.45));

const moon = new THREE.DirectionalLight(0xaaccff,1.4);
moon.position.set(10,18,10);
moon.castShadow = true;

scene.add(moon);

////////////////////////////////////////////////////////////
// FLOOR
////////////////////////////////////////////////////////////

const floor = new THREE.Mesh(

    new THREE.PlaneGeometry(200,200),

    new THREE.MeshStandardMaterial({
        color:0x141414,
        roughness:1
    })
);

floor.rotation.x = -Math.PI/2;
floor.receiveShadow = true;

scene.add(floor);

////////////////////////////////////////////////////////////
// MATERIALS
////////////////////////////////////////////////////////////

const MAT = {
    purple:new THREE.MeshStandardMaterial({ color:0x6f2cff, flatShading:true }),
    darkPurple:new THREE.MeshStandardMaterial({ color:0x351255, flatShading:true }),
    blue:new THREE.MeshStandardMaterial({ color:0x253d7a, flatShading:true }),
    black:new THREE.MeshStandardMaterial({ color:0x101010, flatShading:true }),
    steel:new THREE.MeshStandardMaterial({ color:0xbcc2cc, flatShading:true }),
    bone:new THREE.MeshStandardMaterial({ color:0xd7d0c7, flatShading:true }),
    cloth:new THREE.MeshStandardMaterial({ color:0x4a2270, flatShading:true }),
    glow:new THREE.MeshStandardMaterial({
        color:0xaa66ff, emissive:0x7d2cff, emissiveIntensity:2, flatShading:true
    }),
    horse:new THREE.MeshStandardMaterial({ color:0x7560a8, flatShading:true })
};

////////////////////////////////////////////////////////////
// PURE JSON MODEL
const dkJSON = {

root:{
    pos:[0,0,0],
    children:[
        "horseBody",
        "horseNeck",
        "horseHead",
        "horseLegFL",
        "horseLegFR",
        "horseLegBL",
        "horseLegBR",
        "riderPelvis"
    ]
},

////////////////////////////////////////////////////////////
// HORSE
////////////////////////////////////////////////////////////

horseBody:{
    pos:[0,4,0],
    geo:["box",4.8,2.8,2.6],
    mat:"horse",
    children:[
        "horseArmor",
        "tail"
    ]
},

horseArmor:{
    pos:[0,0,0],
    geo:["box",5.2,3.1,2.9],
    mat:"darkPurple"
},

tail:{
    pos:[0,0,-2],
    geo:["cone",0.5,2.2,4],
    rot:[Math.PI,0,0],
    mat:"purple"
},

horseNeck:{
    pos:[0,5.6,1.8],
    geo:["box",1.4,2.5,7.3],
    rot:[-0.5,0,0],
    mat:"horse"
},

horseHead:{
    pos:[0,8.8,6.2],
    geo:["box",1.4,1.2,2.8],
    rot:[-0.15,0,0],
    mat:"bone",
    children:[
        "hornL",
        "hornR"
    ]
},

hornL:{
    pos:[-0.45,0.7,0.6],
    geo:["cone",0.15,1.4,4],
    rot:[-0.4,0,-0.2],
    mat:"black"
},

hornR:{
    pos:[0.45,0.7,0.6],
    geo:["cone",0.15,1.4,4],
    rot:[-0.4,0,0.2],
    mat:"black"
},

////////////////////////////////////////////////////////////
// HORSE LEGS
////////////////////////////////////////////////////////////

horseLegFL:{
    pos:[-1.3,1.7,1],
    geo:["box",0.8,3.8,0.8],
    mat:"horse"
},

horseLegFR:{
    pos:[1.3,1.7,1],
    geo:["box",0.8,3.8,0.8],
    mat:"horse"
},

horseLegBL:{
    pos:[-1.3,1.7,-1],
    geo:["box",0.8,3.8,0.8],
    mat:"horse"
},

horseLegBR:{
    pos:[1.3,1.7,-1],
    geo:["box",0.8,3.8,0.8],
    mat:"horse"
},

////////////////////////////////////////////////////////////
// RIDER
////////////////////////////////////////////////////////////

riderPelvis:{
    pos:[0,7,0],
    geo:["box",2.2,1.5,1.5],
    mat:"darkPurple",
    children:[
        "torso",
        "capeL",
        "capeR"
    ]
},

torso:{
    pos:[0,2.2,0],
    geo:["box",2.6,3.2,1.8],
    mat:"purple",
    children:[
        "head",
        "shoulderL",
        "shoulderR",
        "armL",
        "armR",
        "sword"
    ]
},

head:{
    pos:[0,2.5,0],
    geo:["box",1.2,1.5,1.2],
    mat:"steel",
    children:[
        "hair"
    ]
},

hair:{
    pos:[0,0.5,-0.6],
    geo:["box",1.3,1.8,0.6],
    mat:"bone"
},

shoulderL:{
    pos:[-1.7,1.3,0],
    geo:["cone",0.7,1.4,4],
    rot:[0,0,1.4],
    mat:"purple"
},

shoulderR:{
    pos:[1.7,1.3,0],
    geo:["cone",0.7,1.4,4],
    rot:[0,0,-1.4],
    mat:"purple"
},

armL:{
    pos:[-2.2,0,0],
    geo:["box",0.9,3,0.9],
    mat:"blue"
},

armR:{
    pos:[2.2,0,0],
    geo:["box",0.9,3,0.9],
    mat:"blue"
},

////////////////////////////////////////////////////////////
// SWORD
////////////////////////////////////////////////////////////

sword:{
    pos:[3.3,-10.4,1],
    geo:["box",4.2,0.4,1],
    rot:[0.1,0,-0.45],
    mat:"steel",
    children:[
        "bladeGlow"
    ]
},

bladeGlow:{
    pos:[0,0,0],
    geo:["box",4.25,0.2,0.25],
    mat:"glow"
},

////////////////////////////////////////////////////////////
// CAPES
////////////////////////////////////////////////////////////

capeL:{
    pos:[-1.2,0.5,-1.2],
    geo:["box",1.2,4.8,0.15],
    rot:[0.2,0.15,0.1],
    mat:"cloth"
},

capeR:{
    pos:[1.2,0.5,-1.2],
    geo:["box",1.2,4.8,0.15],
    rot:[0.2,-0.15,-0.1],
    mat:"cloth"
}

};

////////////////////////////////////////////////////////////
// MODEL BUILDER
////////////////////////////////////////////////////////////

const bones = {};

function buildNode(name){
    const data = dkJSON[name];

    const group = new THREE.Group();
    bones[name] = group;

    if(data.pos) group.position.set(...data.pos);
    if(data.rot) group.rotation.set(...data.rot);

    if(data.geo){
        let mesh;
        const g = data.geo;

        if(g[0] === "box"){
            mesh = new THREE.Mesh(
                new THREE.BoxGeometry(g[1],g[2],g[3]),
                MAT[data.mat]
            );
        }

        if(g[0] === "cone"){
            mesh = new THREE.Mesh(
                new THREE.ConeGeometry(g[1],g[2],g[3]),
                MAT[data.mat]
            );
        }

        mesh.castShadow = true;
        group.add(mesh);
        group.mesh = mesh;
    }

    if(data.children){
        for(const childName of data.children){
            group.add(buildNode(childName));
        }
    }

    return group;
}

////////////////////////////////////////////////////////////
// CREATE MODEL
////////////////////////////////////////////////////////////

const deathKnight = buildNode("root");
scene.add(deathKnight);

////////////////////////////////////////////////////////////
// NECROTIC GLOW
////////////////////////////////////////////////////////////

const aura = new THREE.Mesh(

    new THREE.CylinderGeometry(3.5,3.5,0.2,16),

    new THREE.MeshBasicMaterial({
        color:0x7d2cff,
        transparent:true,
        opacity:0.4
    })
);

aura.position.y = 0.05;

scene.add(aura);

////////////////////////////////////////////////////////////
// PARTICLES
////////////////////////////////////////////////////////////

const particles = [];

for(let i=0;i<20;i++){

    const p = new THREE.Mesh(

        new THREE.SphereGeometry(0.05,4,4),

        new THREE.MeshBasicMaterial({
            color:0xaa66ff
        })
    );

    scene.add(p);

    particles.push({
        mesh:p,
        angle:Math.random()*Math.PI*2,
        radius:2 + Math.random()*2,
        speed:0.5 + Math.random()
    });
}

////////////////////////////////////////////////////////////
// ANIMATION
////////////////////////////////////////////////////////////

const anim = {
    state:"idle",
    time:0
};

////////////////////////////////////////////////////////////
// UPDATE
////////////////////////////////////////////////////////////

function updateAnimation(dt){

    anim.time += dt;

    const t = anim.time;

    console.log('debug bones.root: ', bones.root);
    console.log('debug bones.capeL: ', bones.capeL);

    const FL = bones.horseLegFL;
    const FR = bones.horseLegFR;
    const BL = bones.horseLegBL;
    const BR = bones.horseLegBR;

    const ARM = bones.armR;
    const SWORD = bones.sword;

    const CAPEL = bones.capeL;
    const CAPER = bones.capeR;

    ////////////////////////////////////////////////////////
    // PARTICLES
    ////////////////////////////////////////////////////////

    particles.forEach(p=>{

        p.angle += dt * p.speed;

        p.mesh.position.set(
            Math.cos(p.angle)*p.radius,
            1 + Math.sin(t*3+p.angle)*0.4,
            Math.sin(p.angle)*p.radius
        );
    });

    aura.material.opacity = 0.3 + Math.sin(t*3)*0.1;

    ////////////////////////////////////////////////////////
    // IDLE
    ////////////////////////////////////////////////////////

    if(anim.state === "idle"){

        deathKnight.position.y =
            Math.sin(t*2)*0.08;

        CAPEL.rotation.x =
            0.2 + Math.sin(t*2)*0.05;

        CAPER.rotation.x =
        0.2 + Math.sin(t*2+1)*0.05;
    }

    ////////////////////////////////////////////////////////
    // RUN
    ////////////////////////////////////////////////////////

    if(anim.state === "run"){

        const gallop = Math.sin(t*10);

       FL.rotation.x = gallop * 0.9;
        BR.rotation.x = gallop * 0.9;

        FR.rotation.x = -gallop * 0.9;
        BL.rotation.x = -gallop * 0.9;

        deathKnight.position.x += 0.08;

        deathKnight.position.y =
            Math.abs(Math.sin(t*10))*0.2;

        CAPEL.rotation.x = 0.7;
        CAPER.rotation.x = 0.7;

        if(deathKnight.position.x > 15)
            deathKnight.position.x = -15;
    }

    ////////////////////////////////////////////////////////
    // ATTACK
    ////////////////////////////////////////////////////////

    if(anim.state === "attack"){

        const slash = Math.sin(t*12);

        ARM.rotation.z = -1 + slash*0.7;

        SWORD.rotation.y = slash*0.8;

        aura.scale.setScalar(
            1 + Math.abs(slash)*0.2
        );
    }

    ////////////////////////////////////////////////////////
    // DIE
    ////////////////////////////////////////////////////////

    if(anim.state === "die"){

        deathKnight.rotation.z = Math.min(
            Math.PI/2,
            deathKnight.rotation.z + 0.01
        );

        aura.material.opacity *= 0.98;
    }

}

////////////////////////////////////////////////////////////
// INPUT
////////////////////////////////////////////////////////////

window.addEventListener("keydown",e=>{

    if(e.key==="1")
        anim.state="idle";

    if(e.key==="2")
        anim.state="run";

    if(e.key==="3")
        anim.state="attack";

    if(e.key==="4")
        anim.state="die";

});

////////////////////////////////////////////////////////////
// LOOP
////////////////////////////////////////////////////////////

const clock = new THREE.Clock();

let camRot = 0;

////////////////////////////////////////////////////////////
// G + LMB MODEL GRAB ROTATION
////////////////////////////////////////////////////////////

let grabMode = false;
let dragging = false;
let pausedOrbit = false;

let lastMouseX = 0;

window.addEventListener("keydown", e=>{

    const k = e.key.toLowerCase();

    // Toggle grab mode with G
    if(k === "g"){
        grabMode = !grabMode;
        dragging = false;
        document.body.style.cursor = grabMode ? "grab" : "default";
    }

    // Escape cancels grab mode
    if(k === "escape"){
        grabMode = false;
        dragging = false;
        document.body.style.cursor = "default";
    }

    // P pauses camera orbit
    if(k === "p"){
        pausedOrbit = !pausedOrbit;
    }

});

renderer.domElement.addEventListener("mousedown", e=>{
    if(e.button === 0 && grabMode){
        dragging = true;
        lastMouseX = e.clientX;
        document.body.style.cursor = "grabbing";
    }
});

window.addEventListener("mouseup", ()=>{
    dragging = false;
    if(grabMode) document.body.style.cursor = "grab";
});

window.addEventListener("mousemove", e=>{
    if(!dragging) return;

    const dx = e.clientX - lastMouseX;
    lastMouseX = e.clientX;

    // Y-axis rotation only
    deathKnight.rotation.y += dx * 0.01;
});

function loop(){

    requestAnimationFrame(loop);

    const dt = clock.getDelta();

    if(!pausedOrbit){
        camRot += dt * 0.15;
    }

    camera.position.x = Math.sin(camRot)*18;
    camera.position.z = Math.cos(camRot)*18;

    camera.lookAt(0,6,0);

    updateAnimation(dt);

    renderer.render(scene,camera);
}

loop();

////////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{

    camera.aspect = innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});
</script>
</body>
</html>
