class GridManager {
    constructor() {
        this.mode = 'square';
        // unified spacing
        this.tileSize = 2;
        this.hexRadius = 1.15;
    }
    setMode(mode) {
        this.mode = mode;
        regenerateGround();
    }
    // SNAP TO CELL CENTER
    snapPosition(pos) {
        // SQUARE
        if (this.mode === 'square') {
            const snappedX =
                Math.floor(pos.x / this.tileSize)
                * this.tileSize
                + this.tileSize * 0.5;
            const snappedZ =
                Math.floor(pos.z / this.tileSize)
                * this.tileSize
                + this.tileSize * 0.5;
            return new THREE.Vector3(
                snappedX,
                pos.y,
                snappedZ
            );
        }
        // HEX
        const size = this.hexRadius;
        const q =
            (Math.sqrt(3)/3 * pos.x - 1/3 * pos.z)
            / size;
        const r =
            (2/3 * pos.z)
            / size;
        const rq = Math.round(q);
        const rr = Math.round(r);
        const x =
            size * Math.sqrt(3) * (rq + rr/2);
        const z =
            size * 1.5 * rr;
        return new THREE.Vector3(
            x,
            pos.y,
            z
        );
    }
}
class ObjectSpawner {
    constructor(scene, occupancyGrid) {
        this.scene = scene;
        this.occupancyGrid = occupancyGrid;
    }

    occupyTile(x, z, radius = 1) {
        for (let dz = -radius; dz <= radius; dz++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const key = `${x+dx},${z+dz}`;
                this.occupancyGrid.add(key);
            }
        }
    }
    isOccupied(x, z, radius = 1) {
        for (let dz = -radius; dz <= radius; dz++) {
            for (let dx = -radius; dx <= radius; dx++) {
                const key = `${x+dx},${z+dz}`;
                if (this.occupancyGrid.has(key)) {
                    return true;
                }
            }
        }
        return false;
    }
    spawnTree(position) {
        const group = new THREE.Group();
        const trunk = new THREE.Mesh(
            new THREE.CylinderGeometry(0.3,0.4,2),
            new THREE.MeshStandardMaterial({
                color: 0x6b4423
            })
        );
        trunk.position.y = 1;
        const leaves = new THREE.Mesh(
            new THREE.ConeGeometry(1.5, 3, 8),
            new THREE.MeshStandardMaterial({
                color: 0x228833
            })
        );
        leaves.position.y = 3;
        group.add(trunk);
        group.add(leaves);
        group.position.copy(position);
        this.scene.add(group);
        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }
    spawnRock(position) {
        const rock = new THREE.Mesh(
            new THREE.DodecahedronGeometry(0.9),
            new THREE.MeshStandardMaterial({
                color: 0x777777
            })
        );
        rock.position.copy(position);
        this.scene.add(rock);
        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }
    spawnHouse(position) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.6,2,1.6),
            new THREE.MeshStandardMaterial({
                color: 0xb07b4f
            })
        );
        body.position.y = 1;
        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(1.5,1.7,4),
            new THREE.MeshStandardMaterial({
                color: 0x7d1e1e
            })
        );
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 3;
        group.add(body);
        group.add(roof);
        group.position.copy(position);
        this.scene.add(group);
        this.occupyTile(
            Math.round(position.x),
            Math.round(position.z),
            1
        );
    }
}
class DraftConstructionPlacement {
    constructor(scene, spawner) {
        this.scene = scene;
        this.spawner = spawner;
        this.active = false;
        this.preview = this.createPreview();
        this.scene.add(this.preview);
    }
    createPreview() {
        const group = new THREE.Group();
        const mat = new THREE.MeshStandardMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0.55
        });
        const body = new THREE.Mesh(
            new THREE.BoxGeometry(1.6,2,1.6),
            mat
        );
        body.position.y = 1;
        const roof = new THREE.Mesh(
            new THREE.ConeGeometry(1.5,1.7,4),
            mat
        );
        roof.rotation.y = Math.PI / 4;
        roof.position.y = 3;
        group.add(body);
        group.add(roof);
        group.visible = false;
        return group;
    }
    start() {

        this.active = true;
        this.preview.visible = true;
    }
    cancel() {

        this.active = false;
        this.preview.visible = false;
    }
    update(position) {
        if (!this.active) return;
        this.preview.position.copy(position);
        const occupied =
            this.spawner.isOccupied(
                Math.round(position.x),
                Math.round(position.z),
                1
            );
        const color =
            occupied
                ? 0xff3333
                : 0x33ff66;
        this.preview.traverse(child => {
            if (child.material) {
                child.material.color.setHex(color);
            }
        });
        this.allowed = !occupied;
    }
    confirm() {
        if (!this.active) return;
        if (this.allowed) {
            this.spawner.spawnHouse(
                this.preview.position.clone()
            );
        }
    }
}

function clearTreesNear(x,z,radius){
    for(let i=trees.length-1;i>=0;i--){
        const t = trees[i];
        const dx = t.position.x - x;
        const dz = t.position.z - z;
        if(Math.sqrt(dx*dx+dz*dz) < radius){
            scene.remove(t);
            trees.splice(i,1);
        }
    }
}

//MINING WORKFLOW
const MINE_INTERACTION_DISTANCE = 7;
const TOWNHALL_INTERACTION_DISTANCE = 6;
function startMining(){
    const data =
        peasant.userData;
    data.state =
        "mining";
    data.miningTimer =
        0;
}
function updateMining(delta){
    const data =
        peasant.userData;
    data.miningTimer += delta;
    if(
        data.miningTimer >=
        data.miningDuration
    ){
        finishMining();
    }
}
function finishMining(){
    const data =
        peasant.userData;
    const mine =
        data.goldmine;
    if(mine.userData.gold < 10){
        data.state = "idle";
        return;
    }
    mine.userData.gold -= 10;
    data.carriedGold =
        data.carryCapacity;
    data.state =
        "movingToTownHall";
    data.target =
        data.townHall.position.clone();
}
function depositGold(){
    const data =
        peasant.userData;
    const amount =
        data.carriedGold;
    if(amount <= 0){
        data.state = "idle";
        return;
    }
    data.townHall.userData.gold += amount;
    data.carriedGold = 0;
    data.state =
        "movingToMine";
    data.target =
        data.goldmine.position.clone();
}

function isNearTarget(target, distance){
    const dx =
        peasant.position.x -
        target.x;
    const dz =
        peasant.position.z -
        target.z;
    const dist =
        Math.sqrt(
            dx * dx +
            dz * dz
        );
    return dist <= distance;
}
function moveToward(target){
    const dir =
        new THREE.Vector3()
        .subVectors(
            target,
            peasant.position
        );
    dir.y = 0;
    const dist =
        dir.length();

    if(dist <= 0.001){
        return;
    }
    dir.normalize();
    peasant.position.add(
        dir.multiplyScalar(
            peasant.userData.speed
        )
    );
}
function movePeasant(delta){
    const data =
        peasant.userData;
    // MOVING TO GOLD MINE
    if(data.state === "movingToMine"){
        if(
            isNearTarget(
                data.goldmine.position,
                MINE_INTERACTION_DISTANCE
            )
        ){
            data.target = null;
            startMining();
            return;
        }
        moveToward(
            data.goldmine.position
        );
        return;
    }
    // MINING
    if(data.state === "mining"){
        updateMining(delta);
        return;
    }
    // MOVING TO TOWN HALL
    if(data.state === "movingToTownHall"){
        if(
            isNearTarget(
                data.townHall.position,
                TOWNHALL_INTERACTION_DISTANCE
            )
        ){
            data.target = null;
            depositGold();
            return;
        }
        moveToward(data.townHall.position);
        return;
    }
    // NORMAL MOVEMENT
    if(data.state === "moving"){
        if(data.target){
            if(isNearTarget(data.target,0.1)
            ){
                data.target = null;
                data.state = "idle";
                return;
            }
            moveToward(
                data.target
            );
        }
    }
}
// PEASANT COMMANDS
function commandPeasantToMine(mine){
    const data = peasant.userData;
    data.goldmine = mine;
    data.townHall = townHall;
    data.state =
        "movingToMine";
    data.target =
        mine.position.clone();
}
function commandPeasantToTownHall(building){
    const data = peasant.userData;
    data.townHall = building;
    data.state =
        "movingToTownHall";
    data.target =
        building.position.clone();
}
// INPUT
const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener(
    "mousedown",
    e=>{
    mouse.x =
        (e.clientX/window.innerWidth)*2-1;
    mouse.y =
        -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(
        mouse,
        camera
    );

    // LEFT CLICK
    if(e.button === 0){
        const hits =
            raycaster.intersectObjects(
                scene.children,
                true
            );
        if(hits.length){
            let obj = hits[0].object;
            while(obj.parent && !obj.userData.type){
                obj = obj.parent;
            }

            if(obj.userData.type ==="peasant"){
                deselectAll();
                selectedObject = peasant;
                peasant.selectionRing
                .visible = true;
                renderPeasantHUD();
                return;
            }

            if(obj.userData.type ==="goldmine"){
                deselectAll();
                selectedObject = goldmine;
                goldmine.selectionRing.visible = true;
                renderGoldmineHUD();
                return;
            }

            if(obj.userData.type ==="townhall"){
                deselectAll();
                selectedObject = townhall;
                townhall.selectionRing.visible = true;
                renderTownhallHUD();
                return;
            }
        }

        deselectAll();
    }
    // RIGHT CLICK COMMAND
    if(
        e.button === 2 &&
        selectedObject === peasant
    ){
        e.preventDefault();
        // 1. CHECK GOLD MINE
        const mineHits =
            raycaster.intersectObject(
                goldmine,
                true
            );
        if(mineHits.length){
            commandPeasantToMine(
                goldmine
            );
            return;
        }
        // 2. CHECK TOWN HALL
        const townHallHits =
            raycaster.intersectObject(
                townHall,
                true
            );
        if(townHallHits.length){
            commandPeasantToTownHall(
                townHall
            );

            return;
        }
        // 3. OTHERWISE MOVE TO GROUND
        const groundHit =
            raycaster.intersectObject(
                ground
            );
        if(groundHit.length){
            peasant.userData.target =
                groundHit[0].point.clone();

            peasant.userData.state =
                "moving";
        }
    }
});

window.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

document.getElementById('buildHouseBtn')
.addEventListener('click', () => {
    draftPlacement.start();
});

    
// MINIMAP
const minimap =
    document.getElementById("minimap");

const mini =
    minimap.getContext("2d");

function mapToMini(v){

    return {
        x:(v.x/WORLD_SIZE)*200 + 100,
        y:(v.z/WORLD_SIZE)*200 + 100
    };
}

function updateMinimap(){
    mini.fillStyle = "#111";
    mini.fillRect(0,0,200,200);
    mini.strokeStyle = "#355a2c";
    mini.strokeRect(0,0,200,200);
    trees.forEach(t=>{
        const p =
            mapToMini(t.position);
        mini.fillStyle = "#228833";
        mini.fillRect(
            p.x,
            p.y,
            2,
            2
        );
    });
    const g =
        mapToMini(goldmine.position);
    mini.fillStyle = "#ffcc22";
    mini.beginPath();
    mini.arc(
        g.x,
        g.y,
        5,
        0,
        Math.PI*2
    );
    mini.fill();
    workers.forEach(w=>{
        const p = mapToMini(w.position);
        mini.fillStyle =
            selectedObject === w
            ? "#00ff66"
            : "#44aaff";
        mini.beginPath();
        mini.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );
        mini.fill();
    });
}

const clock = new THREE.Clock();
// LOOP
function animate(){
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    movePeasant(delta);
    updateMinimap();
    renderer.render(
        scene,
        camera
    );
}

animate();

// RESIZE
window.addEventListener(
    "resize",
    ()=>{
    camera.aspect =
        window.innerWidth/
        window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>
