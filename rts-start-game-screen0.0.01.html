<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RTS Faction Prototype - PS1/PS2 Style Game Preview</title>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
    font-family:monospace;
    color:white;
}
/* GLOBAL */
*{
    box-sizing:border-box;
}
/* LEFT MENU */
#menu{
    position:absolute;
    top:0;
    left:0;
    width:300px;
    height:100vh;
    background:#111;
    color:white;
    overflow-y:auto;
    overflow-x:hidden;
    border-right:2px solid #333;
    z-index:20;
}
/* RIGHT PANEL */
#selectionPanel{
    position:absolute;
    top:0;
    right:0;
    width:320px;
    height:100vh;
    background:
        linear-gradient(
            to bottom,
            #20170f,
            #0d0d0d
        );
    color:white;
    border-left:2px solid #4e3824;
    overflow-y:auto;
    overflow-x:hidden;
    z-index:20;
    padding:12px;
}
/* PANEL FRAME */
.rtsPanel{
    border:2px solid #5a4128;
    background:#15110d;
    box-shadow:
        inset 0 0 12px rgba(0,0,0,.8),
        0 0 10px rgba(0,0,0,.5);
    padding:12px;
    margin-bottom:12px;
}
/* TITLE */
.panelTitle{
    color:#f2c14d;
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}
/* MAP NAME */
#mapName{
    color:#ffd86b;
    font-size:20px;
    margin-bottom:10px;
}
/* MAP PREVIEW */
#mapPreview{
    width:100%;
    height:220px;
    border:3px solid #5a4128;
    background:#000;
    object-fit:cover;
    image-rendering:pixelated;
    display:block;
    margin-bottom:12px;
}
/* SETTINGS */
.settingRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding:6px 0;
    border-bottom:1px solid #2d2117;
}
.settingLabel{
    color:#d9b05d;
    font-size:14px;
    text-transform:uppercase;
}
.settingValue{
    color:#fff;
}
/* DESCRIPTION */
#mapDescription{
    line-height:1.5;
    color:#d7d7d7;
    font-size:13px;
    padding:8px;
    background:#0e0e0e;
    border:1px solid #2a2a2a;
}
/* START BUTTON */
#startButton{
    width:100%;
    padding:16px;
    margin-top:16px;
    font-size:22px;
    font-weight:bold;
    text-align:center;
    background:
        linear-gradient(
            to bottom,
            #2058b5,
            #102e63
        );
    border:2px solid #7db5ff;
    color:#ffe28a;
    cursor:pointer;
    transition:.15s;
    text-transform:uppercase;
    letter-spacing:2px;
}
#startButton:hover{
    transform:scale(1.02);
    background:
        linear-gradient(
            to bottom,
            #3272de,
            #163d84
        );
}
/* BOTTOM UI */
#ui{
    position:absolute;
    left:300px;
    right:320px;
    bottom:0;
    height:90px;
    background:#000;
    color:white;
    padding:10px;
    border-top:2px solid #333;
    z-index:30;
}
/* LEFT PANEL */
#hudLeft{
    width:240px;
    padding:10px;
    border-right:2px solid #333;
    background:#0a0a0a;
}
#minimap{
    width:200px;
    height:200px;
    border:4px solid #666;
    background:#111;
    image-rendering:pixelated;
}
/* CENTER PANEL */
#hudCenter{
    width:440px;
    display:flex;
    gap:14px;
    padding:12px;
    border-right:2px solid #333;
    background:#101010;
}
#unitPortrait{
    width:140px;
    height:140px;
    border:3px solid #666;
    background:#222;
    display:flex;
    align-items:center;
    justify-content:center;
}
#portraitModel{
    font-size:72px;
}
#unitStats{
    flex:1;
    color:white;
}
.unitName{
    font-size:20px;
    color:#ffdc73;
    margin-bottom:10px;
}
.healthBar{
    width:100%;
    height:18px;
    background:#330000;
    border:2px solid #666;
    margin-bottom:10px;
}

#healthFill{
    width:100%;
    height:100%;
    background:
        linear-gradient(
            to right,
            #00aa00,
            #33ff33
        );
}
.statLine{
    margin-bottom:6px;
    font-size:14px;
}
/* INVENTORY */
#inventoryGrid{
    width:120px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:repeat(3, 1fr);
    gap:6px;
}

.inventorySlot{
    width:52px;
    height:52px;
    background:#1a1a1a;
    border:2px solid #555;
}
/* RIGHT PANEL */
#hudRight{
    flex:1;
    padding:12px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:#0c0c0c;
}
#commandGrid{
    display:grid;
    grid-template-columns:repeat(4,72px);
    grid-template-rows:repeat(3,72px);
    gap:8px;
}
.commandCard{
    position:relative;
    border:2px solid #666;
    background:#222;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    transition:.15s;
}
.commandCard:hover{
    background:#444;
    transform:scale(1.04);
}
.hotkey{
    position:absolute;
    bottom:2px;
    right:4px;
    color:#ffdc73;
    font-size:11px;
}
#tooltip{
    height:48px;
    border:2px solid #444;
    background:#111;
    color:#ddd;
    padding:8px;
    font-size:13px;
}
/* SECTIONS */
.section{
    padding:10px;
    border-bottom:1px solid #222;
}
.selectionCard{
    padding:10px;
    border-bottom:1px solid #222;
}
/* BUTTONS */
button{
    width:100%;
    padding:8px;
    margin:4px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    cursor:pointer;
    text-align:left;
    font-family:monospace;
}
button:hover{
    background:#333;
}
/* ACTIVE FACTION */
.activeFaction{
    background:#355a2c;
    border-color:#7fcf5f;
}
/* DROPDOWN */
select{
    background:#1c1c1c;
    color:white;
    border:1px solid #555;
    padding:5px;
    width:120px;
}
/* CANVAS */
canvas{
    position:absolute;
    top:0;
    left:300px;
    width:calc(100vw - 620px) !important;
    height:100vh !important;
    display:block;
}
</style>
</head>

<body>

<div id="menu"></div>

<!-- RIGHT RTS GAME PANEL -->
<div id="selectionPanel">

    <!-- MAP INFO -->
    <div class="rtsPanel">

        <div class="panelTitle">
            Single Player Lobby
        </div>

        <div id="mapName">
            Isle of Dread
        </div>

        <!-- Replace with real map image later -->
        <img
            id="mapPreview"
            src="https://picsum.photos/320/220?random=4"
        />

        <div class="settingRow">
            <div class="settingLabel">
                Game Speed
            </div>

            <div class="settingValue">
                <select id="gameSpeed">
                    <option>Slow</option>
                    <option selected>Normal</option>
                    <option>Fast</option>
                    <option>Ultra Fast</option>
                </select>
            </div>
        </div>

        <div class="settingRow">
            <div class="settingLabel">
                Visibility
            </div>

            <div class="settingValue">
                Default
            </div>
        </div>

        <div class="settingRow">
            <div class="settingLabel">
                Observers
            </div>

            <div class="settingValue">
                No Observers
            </div>
        </div>

        <div id="mapDescription">
            Having allied with a trio of Bronze Dragons,
            the Centaur are the uncontested rulers
            of this island. Build up a reasonable force
            before you pick a fight.
        </div>

        <button id="startButton">
            Start Game
        </button>

    </div>

    <!-- SELECTION -->
    <div class="selectionCard">
        <h3>Selection</h3>
        <div id="selectedInfo">None</div>
    </div>

</div>

<div id="ui">
RTS Neutral Unit Prototype - PS1/PS2 Style
</div>

<script type="module">

import * as THREE from "https://esm.sh/three@0.165.0";
//CLEAR TREES
function clearTreesNear(x,z,radius){
    for(let i=trees.length-1;i>=0;i--){
        const t = trees[i];
        const dx = t.position.x - x;
        const dz = t.position.z - z;
        if(Math.sqrt(dx*dx+dz*dz) < radius){
            scene.remove(t);
            trees.splice(i,1);
        }
    }
}
// SAFE CHECK
if(typeof THREE === "undefined"){
    alert("THREE failed to load.");
    throw new Error("THREE failed");
}
// VIEW CONSTANTS
const LEFT_W = 300;
const RIGHT_W = 320;
// RTS GAME SETTINGS
const GameSettings = {
    mapName:"Isle of Dread",
    gameSpeed:"Normal",
    started:false
};
// START GAME BUTTON
const startButton =
    document.getElementById("startButton");
startButton.addEventListener("click",()=>{
    GameSettings.started = true;
    const speed =
        document.getElementById(
            "gameSpeed"
        ).value;
    GameSettings.gameSpeed = speed;
    document.getElementById(
        "ui"
    ).innerHTML = `
        Game Started |
        Map:
        ${GameSettings.mapName}
        |
        Speed:
        ${speed}
    `;

    startButton.innerHTML =
        "Game Running";

    startButton.style.background =
        "linear-gradient(to bottom,#2d7d32,#18451b)";

    console.log(
        "START GAME",
        GameSettings
    );
});
// SCENE
const scene = new THREE.Scene();

scene.background = new THREE.Color(0x101014);

scene.fog = new THREE.Fog(
    0x101014,
    40,
    180
);

const VIEW_W =
    window.innerWidth - LEFT_W - RIGHT_W;

const VIEW_H =
    window.innerHeight;

const camera = new THREE.PerspectiveCamera(
    60,
    VIEW_W / VIEW_H,
    0.1,
    2000
);

camera.position.set(45,35,45);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.shadowMap.enabled = true;

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    VIEW_W,
    VIEW_H
);

renderer.domElement.style.position = "absolute";
renderer.domElement.style.left = LEFT_W + "px";
renderer.domElement.style.top = "0px";

document.body.appendChild(renderer.domElement);

////////////////////////////////////////////////////////////
// LIGHTS
////////////////////////////////////////////////////////////

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.7
    )
);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.8
);

sun.position.set(50,80,40);

sun.castShadow = true;

scene.add(sun);

////////////////////////////////////////////////////////////
// APP STATE
////////////////////////////////////////////////////////////

const AppState = {

    selectedFaction:"kobold"

};

////////////////////////////////////////////////////////////
// FACTIONS
////////////////////////////////////////////////////////////

const Factions = {

    human:{

        name:"Human",

        buildings:[
            {
                id:"human-keep",
                name:"Keep"
            },
            {
                id:"human-barracks",
                name:"Barracks"
            }
        ],

        units:[
            {
                id:"human-peon",
                name:"Peon"
            }
        ]
    },

    kobold:{

        name:"Neutral",

        buildings:[
            {
                id:"kobold-gnoll-camp",
                name:"Gnoll Camp"
            },
            {
                id:"kobold-mine",
                name:"Kobold Mine"
            },
            {
                id:"kobold-watch-tower",
                name:"Watch Tower"
            }
        ],

        units:[
            {
                id:"kobold",
                name:"Kobold Miner"
            },
            {
                id:"gnoll",
                name:"Gnoll Brute"
            },
            {
                id:"goblin-whip",
                name:"Goblin Taskmaster"
            },
            {
                id:"wolf-rider",
                name:"Goblin Wolf Rider"
            }
        ]
    }

};

////////////////////////////////////////////////////////////
// MENU
////////////////////////////////////////////////////////////

const menu =
    document.getElementById("menu");

function renderMenu(){

    const faction =
        Factions[AppState.selectedFaction];

    const factionButtons =
        Object.entries(Factions)
        .map(([id,data])=>{

            const active =
                id === AppState.selectedFaction;

            return `
            <button
                class="${active ? "activeFaction" : ""}"
                onclick="selectFaction('${id}')"
            >
                ${active ? "■" : "□"}
                ${data.name}
            </button>
            `;
        })
        .join("");

    const buildingButtons =
        faction.buildings
        .map(building=>{

            return `
            <button
                onclick="spawnFactionBuilding('${building.id}')"
            >
                ${building.name}
            </button>
            `;
        })
        .join("");

    const unitButtons =
        faction.units
        .map(unit=>{

            return `
            <button
                onclick="spawnRaceUnit('${unit.id}')"
            >
                ${unit.name}
            </button>
            `;
        })
        .join("");

    menu.innerHTML = `

    <div class="section">
        <h2>${faction.name} Faction</h2>
    </div>

    <div class="section">

        <h3>Factions</h3>

        ${factionButtons}

    </div>

    <div class="section">

        <h3>Buildings</h3>

        ${buildingButtons}

    </div>

    <div class="section">

        <h3>Units</h3>

        ${unitButtons}

    </div>

    `;
}

window.selectFaction = function(id){

    AppState.selectedFaction = id;

    renderMenu();
};

renderMenu();

////////////////////////////////////////////////////////////
// GROUND
////////////////////////////////////////////////////////////

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(240,240),

    new THREE.MeshStandardMaterial({
        color:0x355a2c
    })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
// MATERIALS - 2 separate forms of organization
const stoneMat = new THREE.MeshStandardMaterial({
    color:0x8c877f,
    roughness:0.95
});
const darkStoneMat = new THREE.MeshStandardMaterial({
    color:0x5d5851,
    roughness:1
});
const woodMat = new THREE.MeshStandardMaterial({
    color:0x6b4a2d,
    roughness:0.9
});
const roofMat = new THREE.MeshStandardMaterial({
    color:0x6f665b,
    roughness:1
});
const goldMat = new THREE.MeshStandardMaterial({
    color:0xffd348,
    emissive:0x9b6a00,
    emissiveIntensity:0.7,
    roughness:0.45,
    metalness:0.35
});
const MAT = {
    kobold:new THREE.MeshStandardMaterial({
        color:0xd59c72,
        flatShading:true
    }),
    gnoll:new THREE.MeshStandardMaterial({
        color:0xc89b53,
        flatShading:true
    }),
    goblin:new THREE.MeshStandardMaterial({
        color:0x6fa04e,
        flatShading:true
    }),
    wolf:new THREE.MeshStandardMaterial({
        color:0x555555,
        flatShading:true
    }),
    dark:new THREE.MeshStandardMaterial({
        color:0x2a2118,
        flatShading:true
    }),
    wood:new THREE.MeshStandardMaterial({
        color:0x6f4c2d,
        flatShading:true
    }),
    roof:new THREE.MeshStandardMaterial({
        color:0x4c2b18,
        flatShading:true
    })
};
// HELPERS
function box(w,h,d,mat){
    const m = new THREE.Mesh(
        new THREE.BoxGeometry(w,h,d),
        mat
    );
    m.castShadow = true;
    m.receiveShadow = true;
    return m;
}
function cone(r,h,s,mat){
    const m = new THREE.Mesh(
        new THREE.ConeGeometry(r,h,s),
        mat
    );
    m.castShadow = true;
    return m;
}
// UNITS
const units = [];
function createKobold(){
    const g = new THREE.Group();
    const body =
        box(1.2,1.8,1,MAT.kobold);
    body.position.y = 2;
    g.add(body);
    g.userData.type =
        "Kobold Miner";
    return g;
}
function createGnoll(){
    const g = new THREE.Group();
    const torso =
        box(2.2,3,1.6,MAT.gnoll);
    torso.position.y = 3.5;
    g.add(torso);
    g.userData.type =
        "Gnoll Brute";
    return g;
}

function createGoblinWhip(){
    const g = new THREE.Group();
    const body =
        box(1.4,2.1,1,MAT.goblin);
    body.position.y = 2.5;
    g.add(body);
    g.userData.type =
        "Goblin Taskmaster";
    return g;
}
function createWolfRider(){
    const g = new THREE.Group();
    const wolf =
        box(3.8,1.8,1.4,MAT.wolf);
    wolf.position.y = 2;
    g.add(wolf);
    g.userData.type =
        "Goblin Wolf Rider";
    return g;
}

// BUILDINGS
function createGnollCamp(){
    const g = new THREE.Group();
    const base =
        box(8,4,8,MAT.wood);
    base.position.y = 2;
    g.add(base);
    const roof =
        cone(6,4,4,MAT.roof);
    roof.position.y = 6;
    g.add(roof);
    g.userData.type =
        "Gnoll Camp";
    return g;
}

function createKoboldMine(){
    const g = new THREE.Group();
    const cave =
        box(8,5,6,MAT.dark);
    cave.position.y = 2.5;
    g.add(cave);
    g.userData.type =
        "Kobold Mine";
    return g;
}

function createWatchTower(){
    const g = new THREE.Group();
    const tower =
        box(3,10,3,MAT.wood);
    tower.position.y = 5;
    g.add(tower);
    g.userData.type =
        "Watch Tower";
    return g;
}

// SPAWN UNITS
window.spawnRaceUnit = function(type){
    let unit;
    if(type==="kobold")
        unit = createKobold();
    if(type==="gnoll")
        unit = createGnoll();
    if(type==="goblin-whip")
        unit = createGoblinWhip();
    if(type==="wolf-rider")
        unit = createWolfRider();
    if(!unit) return;
    unit.position.set(
        (Math.random()-0.5)*50,
        0,
        (Math.random()-0.5)*50
    );
    scene.add(unit);
    units.push(unit);
};
// SPAWN BUILDINGS
window.spawnFactionBuilding = function(type){
    let b;
    if(type==="kobold-gnoll-camp")
        b = createGnollCamp();
    if(type==="kobold-mine")
        b = createKoboldMine();
    if(type==="kobold-watch-tower")
        b = createWatchTower();
    if(!b) return;
    b.position.set(
        (Math.random()-0.5)*60,
        0,
        (Math.random()-0.5)*60
    );
    scene.add(b);
};

// INITIAL SPAWNS
spawnRaceUnit("kobold");
spawnRaceUnit("gnoll");
spawnRaceUnit("goblin-whip");
spawnRaceUnit("wolf-rider");

spawnFactionBuilding("kobold-gnoll-camp");
spawnFactionBuilding("kobold-mine");
spawnFactionBuilding("kobold-watch-tower");

// SELECTION
const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();

window.addEventListener("pointerdown",(e)=>{
    const rect =
        renderer.domElement.getBoundingClientRect();

    mouse.x =
        ((e.clientX - rect.left)/rect.width)*2-1;

    mouse.y =
        -((e.clientY - rect.top)/rect.height)*2+1;

    raycaster.setFromCamera(mouse,camera);

    const hits =
        raycaster.intersectObjects(
            scene.children,
            true
        );

    if(hits.length){

        let obj = hits[0].object;

        while(
            obj.parent &&
            !obj.userData.type
        ){
            obj = obj.parent;
        }

        if(obj.userData.type){

            document.getElementById(
                "selectedInfo"
            ).innerHTML =
                obj.userData.type;
        }
    }
});

// CAMERA
let angle = 0;
function animate(){
    requestAnimationFrame(animate);
    const speed =
        document.getElementById(
            "gameSpeed"
        ).value;
    let multiplier = 1;
    if(speed==="Slow")
        multiplier = 0.4;
    if(speed==="Normal")
        multiplier = 1;
    if(speed==="Fast")
        multiplier = 1.8;
    if(speed==="Ultra Fast")
        multiplier = 3;
    angle += 0.0015 * multiplier;
    camera.position.x =
        Math.cos(angle)*55;
    camera.position.z =
        Math.sin(angle)*55;
    camera.lookAt(0,6,0);
    renderer.render(scene,camera);
}

animate();
// RESIZE
window.addEventListener("resize",()=>{
    const W =
        window.innerWidth - LEFT_W - RIGHT_W;
    const H =
        window.innerHeight;
    camera.aspect = W/H;
    camera.updateProjectionMatrix();
    renderer.setSize(W,H);
});
</script>

</body>
</html>
