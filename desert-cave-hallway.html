<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Desert Cave Platform Hallway</title>

<style>
body { margin:0; overflow:hidden; background:#000; }
canvas { display:block; }

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
font-family:sans-serif;
text-shadow:0 0 5px black;
}
</style>
</head>

<body>

<div id="hud">
WASD move • SPACE jump • Desert Cave Platform Hallway
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

//////////////////////////////////////////////////////////
// SCENE
//////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a120a);

const camera = new THREE.PerspectiveCamera(
70,
innerWidth/innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

//////////////////////////////////////////////////////////
// LIGHTING (cave warm desert glow)
//////////////////////////////////////////////////////////

const hemi = new THREE.HemisphereLight(0xffcc88, 0x22110a, 1.2);
scene.add(hemi);

const light = new THREE.DirectionalLight(0xffddaa, 1);
light.position.set(10,20,10);
scene.add(light);

//////////////////////////////////////////////////////////
// MATERIALS
//////////////////////////////////////////////////////////

const sandMat = new THREE.MeshStandardMaterial({
color:0xc2a070,
roughness:1
});

const stoneMat = new THREE.MeshStandardMaterial({
color:0x6b5b4a,
roughness:1
});

const doorMat = new THREE.MeshStandardMaterial({
color:0x222222
});

//////////////////////////////////////////////////////////
// WORLD STRUCTURE
//////////////////////////////////////////////////////////

const world = new THREE.Group();
scene.add(world);

//////////////////////////////////////////////////////////
// CAVE WALLS (rectangular tunnel)
//////////////////////////////////////////////////////////

function wall(x,y,z,sx,sy,sz){
const m = new THREE.Mesh(
new THREE.BoxGeometry(sx,sy,sz),
stoneMat
);
m.position.set(x,y,z);
world.add(m);
return m;
}

// left/right walls
wall(-12,5,0,2,10,40);
wall(12,5,0,2,10,40);

// ceiling
wall(0,10,0,30,2,40);

//////////////////////////////////////////////////////////
// GROUND LAYOUT
//////////////////////////////////////////////////////////

// LEFT PLATFORM (entry)
const leftPlatform = new THREE.Mesh(
new THREE.BoxGeometry(10,1,10),
sandMat
);
leftPlatform.position.set(-15,1,0);
world.add(leftPlatform);

// RIGHT PLATFORM (exit)
const rightPlatform = new THREE.Mesh(
new THREE.BoxGeometry(10,1,10),
sandMat
);
rightPlatform.position.set(15,1,0);
world.add(rightPlatform);

// LOWER PIT FLOOR
const pit = new THREE.Mesh(
new THREE.BoxGeometry(40,1,20),
new THREE.MeshStandardMaterial({color:0x3a2a1a})
);
pit.position.set(0,-2,0);
world.add(pit);

//////////////////////////////////////////////////////////
// DOORS
//////////////////////////////////////////////////////////

function door(x){
const frame = new THREE.Mesh(
new THREE.BoxGeometry(4,6,1),
stoneMat
);
frame.position.set(x,3,0);
world.add(frame);

const panel = new THREE.Mesh(
new THREE.BoxGeometry(2,4,0.5),
doorMat
);
panel.position.set(x,2,0);
world.add(panel);
}

door(-15);
door(15);

//////////////////////////////////////////////////////////
// JUMPING PLATFORM SYSTEM (6 platforms)
//////////////////////////////////////////////////////////

const platforms = [];

function platform(x,z,y=0){

const p = new THREE.Mesh(
new THREE.BoxGeometry(3,1,3),
stoneMat
);

p.position.set(x,y,z);
world.add(p);

platforms.push(p);

}

platform(-8, -5, -0.5);
platform(-3,  5, -1);
platform( 2, -6, -0.2);
platform( 6,  4, -0.8);
platform( 0,  0, -1.2);
platform( 9, -2, -0.6);

//////////////////////////////////////////////////////////
// PLAYER
//////////////////////////////////////////////////////////

const player = new THREE.Group();

const body = new THREE.Mesh(
new THREE.BoxGeometry(1,1.5,1),
new THREE.MeshStandardMaterial({color:0x44aaff})
);

body.position.y=1;

player.add(body);
scene.add(player);

player.position.set(-15,2,0);

//////////////////////////////////////////////////////////
// INPUT
//////////////////////////////////////////////////////////

let keys = {};

document.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()] = false;
});

//////////////////////////////////////////////////////////
// PHYSICS
//////////////////////////////////////////////////////////

const vel = new THREE.Vector3();
let onGround = false;

//////////////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////////////

const camOffset = new THREE.Vector3(0,3,6);

//////////////////////////////////////////////////////////
// UPDATE LOOP
//////////////////////////////////////////////////////////

function animate(){

requestAnimationFrame(animate);

//////////////////////////////////////////////////////////
// MOVEMENT
//////////////////////////////////////////////////////////

const speed = 0.12;

const forward = new THREE.Vector3(0,0,-1);

if(keys["w"]) player.position.z -= speed;
if(keys["s"]) player.position.z += speed;
if(keys["a"]) player.position.x -= speed;
if(keys["d"]) player.position.x += speed;

//////////////////////////////////////////////////////////
// GRAVITY
//////////////////////////////////////////////////////////

vel.y -= 0.02;
player.position.y += vel.y;

// ground collision
let groundY = 2;

onGround = false;

// check platform landing
const all = [leftPlatform,rightPlatform,...platforms,pit];

for(const p of all){

const box = new THREE.Box3().setFromObject(p);

if(player.position.x > box.min.x &&
player.position.x < box.max.x &&
player.position.z > box.min.z &&
player.position.z < box.max.z){

groundY = Math.max(groundY, box.max.y);
onGround = true;

}

}

if(player.position.y < groundY){
player.position.y = groundY;
vel.y = 0;
onGround = true;
}

//////////////////////////////////////////////////////////
// JUMP
//////////////////////////////////////////////////////////

if(keys[" "] && onGround){
vel.y = 0.45;
onGround = false;
}

//////////////////////////////////////////////////////////
// CAMERA FOLLOW
//////////////////////////////////////////////////////////

const desired = player.position.clone().add(camOffset);

camera.position.lerp(desired,0.1);
camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1,0)));

//////////////////////////////////////////////////////////

renderer.render(scene,camera);

}

animate();

//////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{
camera.aspect = innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
