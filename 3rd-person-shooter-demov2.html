<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AAA TPS Sandbox Prototype</title>

<style>
body{margin:0;overflow:hidden;background:#000;}
canvas{display:block;}

#ui{
position:absolute;inset:0;pointer-events:none;
font-family:sans-serif;
color:white;
}

#crosshair{
position:absolute;left:50%;top:50%;
width:30px;height:30px;
transform:translate(-50%,-50%);
transition:transform .1s;
}

#crosshair.aim{transform:translate(-50%,-50%) scale(0.5);}

.line{position:absolute;background:white;}
.h{width:100%;height:2px;top:50%;}
.v{width:2px;height:100%;left:50%;}

#inventory{
position:absolute;bottom:20px;left:20px;
display:grid;
grid-template-columns:repeat(4,60px);
gap:6px;
pointer-events:auto;
}

.slot{
width:60px;height:60px;
background:rgba(0,0,0,0.4);
border:1px solid #fff;
display:flex;
align-items:center;
justify-content:center;
cursor:grab;
}

.slot.active{border:2px solid yellow;}

#graph{
position:absolute;top:10px;right:10px;
width:220px;height:160px;
background:rgba(0,0,0,0.4);
pointer-events:auto;
font-size:10px;
padding:6px;
}
</style>
</head>

<body>

<div id="ui">

<div id="crosshair">
<div class="line h"></div>
<div class="line v"></div>
</div>

<div id="inventory"></div>

<div id="graph">
BLEND TREE<br>
[Idle]→[Run]<br>
[Run]→[Aim]<br>
[Idle]→[Reload]
</div>

</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

//////////////////////////////////////////////////////////////
// CORE
//////////////////////////////////////////////////////////////

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

//////////////////////////////////////////////////////////////
// DAY/NIGHT SYSTEM
//////////////////////////////////////////////////////////////

let time=0;

const sun=new THREE.DirectionalLight(0xffcc88,1.2);
scene.add(sun);

const sky=new THREE.HemisphereLight(0xffddaa,0x334455,1.2);
scene.add(sky);

function updateDayNight(){

time+=0.002;

sun.position.set(Math.sin(time)*50,Math.cos(time)*50,10);

const t=(Math.sin(time)+1)/2;

scene.background=new THREE.Color().lerpColors(
new THREE.Color(0x000022),
new THREE.Color(0xffcc88),
t
);

}

//////////////////////////////////////////////////////////////
// DESERT TERRAIN (procedural dune)
//////////////////////////////////////////////////////////////

const geo=new THREE.PlaneGeometry(200,200,120,120);
geo.rotateX(-Math.PI/2);

for(let i=0;i<geo.attributes.position.count;i++){

const x=geo.attributes.position.getX(i);
const z=geo.attributes.position.getZ(i);

const dune=
Math.sin(x*0.05)*0.8+
Math.cos(z*0.05)*0.8;

geo.attributes.position.setY(i,dune);

}

const desert=new THREE.Mesh(
geo,
new THREE.MeshStandardMaterial({color:0xc2a15a})
);

scene.add(desert);

//////////////////////////////////////////////////////////////
// PLAYER
//////////////////////////////////////////////////////////////

const player=new THREE.Group();
scene.add(player);

const body=new THREE.Mesh(
new THREE.BoxGeometry(0.8,1.2,0.4),
new THREE.MeshStandardMaterial({color:0x3b82f6})
);
body.position.y=1.5;
player.add(body);

//////////////////////////////////////////////////////////////
// CCD IK (quaternion solver)
//////////////////////////////////////////////////////////////

class Bone{
constructor(len){
this.len=len;
this.pos=new THREE.Vector3();
this.rot=new THREE.Quaternion();
}
}

const bones=[
new Bone(0.6),
new Bone(0.6),
new Bone(0.4)
];

function ccdIK(target){

for(let iter=0;iter<5;iter++){

for(let i=bones.length-1;i>=0;i--){

const end=getEndPos();

const toEnd=end.clone().sub(bones[i].pos).normalize();
const toTarget=target.clone().sub(bones[i].pos).normalize();

const q=new THREE.Quaternion().setFromUnitVectors(toEnd,toTarget);

bones[i].rot.multiply(q);

}

}

}

function getEndPos(){
return player.position.clone().add(new THREE.Vector3(0,1.5,-2));
}

//////////////////////////////////////////////////////////////
// BLEND TREE SYSTEM
//////////////////////////////////////////////////////////////

const blend={
idle:1,
run:0,
aim:0,
reload:0
};

function setBlend(name,val){
blend[name]=val;
}

function updateBlend(){

if(keys.w||keys.a||keys.s||keys.d){
blend.run=1;blend.idle=0;
}else{
blend.run=0;blend.idle=1;
}

if(aiming){
blend.aim=1;
blend.run*=0.5;
}else blend.aim=0;

}

//////////////////////////////////////////////////////////////
// INVENTORY GRID
//////////////////////////////////////////////////////////////

const inv=document.getElementById("inventory");

let slots=["M16","Pistol","Knife","Shotgun"];

function buildInventory(){

inv.innerHTML="";

slots.forEach((s,i)=>{

const d=document.createElement("div");
d.className="slot";
d.innerText=s;
d.draggable=true;
d.dataset.i=i;

d.ondragstart=e=>{
e.dataTransfer.setData("i",i);
};

d.ondrop=e=>{
const from=e.dataTransfer.getData("i");
[slots[from],slots[i]]=[slots[i],slots[from]];
buildInventory();
};

d.ondragover=e=>e.preventDefault();

inv.appendChild(d);

});

}

buildInventory();

//////////////////////////////////////////////////////////////
// INPUT
//////////////////////////////////////////////////////////////

let keys={};
let mouseX=0,mouseY=0;
let aiming=false;

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

document.addEventListener("mousedown",e=>{
if(e.button===2)aiming=true;
});
document.addEventListener("mouseup",e=>{
if(e.button===2)aiming=false;
});

document.addEventListener("mousemove",e=>{
if(document.pointerLockElement){
mouseX+=e.movementX*0.002;
mouseY+=e.movementY*0.002;
}
});

document.body.onclick=()=>document.body.requestPointerLock();

//////////////////////////////////////////////////////////////
// MOVEMENT (GTA style accel)
//////////////////////////////////////////////////////////////

const vel=new THREE.Vector3();

function move(){

const accel=0.02;

const forward=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),mouseX);

if(keys.w)vel.add(forward.multiplyScalar(accel));
if(keys.s)vel.add(forward.multiplyScalar(-accel));

vel.multiplyScalar(0.92);

player.position.add(vel);

player.rotation.y=mouseX;

}

//////////////////////////////////////////////////////////////
// CAMERA
//////////////////////////////////////////////////////////////

function cameraFollow(){

camera.fov=THREE.MathUtils.lerp(camera.fov,aiming?40:70,0.1);
camera.updateProjectionMatrix();

const offset=new THREE.Vector3(0,2,aiming?4:7)
.applyAxisAngle(new THREE.Vector3(0,1,0),mouseX);

camera.position.lerp(player.position.clone().add(offset),0.15);

camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.5,0)));

}

//////////////////////////////////////////////////////////////
// LOOP
//////////////////////////////////////////////////////////////

const cross=document.getElementById("crosshair");

function animate(){

requestAnimationFrame(animate);

updateDayNight();

updateBlend();

move();

cameraFollow();

//////////////////////////////////////////////////////////////
// IK AIM TARGET
//////////////////////////////////////////////////////////////

const aimTarget=player.position.clone().add(new THREE.Vector3(
Math.sin(mouseX)*2,
1.5,
Math.cos(mouseX)*2
));

ccdIK(aimTarget);

//////////////////////////////////////////////////////////////

cross.classList.toggle("aim",aiming);

renderer.render(scene,camera);

}

animate();

//////////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
